<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách giao dịch hậu kiểm giải ngân</title>
    <link rel="stylesheet" href="../../js-table/libs/font-awesome-5/css/all.min.css">
    <link rel="stylesheet" href="../../js-table/libs/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" href="../../js-table/libs/select2/select2.min.css">
    <link rel="stylesheet" href="../../js-table/dist/table.min.css">
    <!-- Style dùng chung với màn giải ngân; nạp sau table.min.css. Bản build: ../disb/dist/disb.min.css -->
    <link rel="stylesheet" href="../disb/disb.css">
    <!-- SLA riêng của màn hậu kiểm (class .hk-sla-*) -->
    <link rel="stylesheet" href="hk-sla.css">
    <!-- Chỉ dùng cho trang demo local -->
    <style>
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 15px;
            background: #fafbfc;
            color: #222;
            overflow-x: hidden;
        }
        .table-config-error {
            padding: 14px 16px;
            border: 1px solid #f0b8b8;
            border-radius: 6px;
            background: #fff2f2;
            color: #b42318;
            font-size: 14px;
            font-weight: 600;
        }
        .page-log {
            margin-top: 15px;
            padding: 10px 12px;
            background: #272c33;
            color: #9fe6a0;
            border-radius: 6px;
            font-family: Menlo, Consolas, monospace;
            font-size: 12px;
            min-height: 80px;
            max-height: 80px;
            overflow-y: auto;
            overflow-x: hidden;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div id="tableContainer1"></div>
    <div class="page-log" id="log"></div>

    <script src="../../js-table/libs/jquery-3.6.0.min.js"></script>
    <script src="../../js-table/libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="../../js-table/libs/select2/select2.min.js"></script>
    <script src="../../js-table/dist/table.min.js"></script>
    <script src="../../js-table/libs/moment-with-locales.min.js"></script>
    <script src="../disb/date-util.js"></script>
    <script src="../disb/constants.js"></script>
    <script src="../disb/disb-util.js"></script>
    <script>
    /* ---------------- Logging ---------------- */
    var logEl = document.getElementById("log");
    function log(msg) {
        logEl.innerHTML = "[" + DateUtil.format(DateUtil.now(), DateUtil.FORMAT.TIME) + "] " + DisbUtil.escapeHtml(msg) +
            "\n" + logEl.innerHTML;
    }

    function pad(n, len) {
        var s = String(n);
        while (s.length < (len || 2)) { s = "0" + s; }
        return s;
    }

    /* ============================================================
       CẤU HÌNH DEMO: sửa các giá trị dưới đây rồi F5
    ============================================================ */
    var DEMO_CONFIG = {
        rows: 10000,             /* số hồ sơ mock; URL ?rows=5000 ghi đè giá trị này */
        seed: 2027,              /* giữ nguyên seed thì F5 vẫn ra cùng bộ dữ liệu; đổi số để ra bộ khác */
        gapMinutes: 10,          /* CREATED_DATE: hồ sơ sau được tạo sớm hơn hồ sơ trước 10 phút (mới nhất ở đầu) */
        maxSubmitMinutes: 120,   /* SUBMIT_DATE (thời điểm tiếp nhận) = CREATED_DATE + ngẫu nhiên 0..120 phút, không quá hiện tại */
        /* PA_EXPIRY_DATE (thời điểm hậu kiểm) = ngày tạo + ngẫu nhiên [min, max] ngày (âm: hồ sơ về đã quá hạn),
           để trang đầu có đủ cờ SLA xanh/vàng/đỏ */
        paExpiryDays: [-3, 7],
        /* Tỷ lệ PA_STATUS theo trọng số (không cần tổng = 100; 0 = không sinh trạng thái đó) */
        statusWeights: { CHUA_HAU_KIEM: 35, CHO_XU_LY: 30, CHO_BO_SUNG: 15, HOAN_THANH: 20 },
        /* Trạng thái chưa tiếp nhận: SUBMIT_DATE, USER_PA, UPDATED_BY/UPDATED_DATE để null
           (SP sort "taskStartTime" theo NVL(SUBMIT_DATE, CREATED_DATE)) */
        unsubmittedStates: ["CHUA_HAU_KIEM"],
        /* AMOUNT (VND) theo loại giao dịch cấp 1, khoảng [min, max] triệu đồng; loại khác để null */
        amountRanges: {
            Giaingankhoanvay: [50, 5000],
            Giainganthauchi: [10, 500],
            Khoitaohanmuc: [500, 20000]
        },
        nameWords: [3, 5]        /* tên KH tiếng Việt ngẫu nhiên từ 3 đến 5 chữ (họ + đệm + tên) */
    };

    /* ============================================================
       Mock dataset
    ============================================================ */
    var TYPE_CODES = [
        { code: "Giaingankhoanvay", name: "Giải ngân khoản vay" },
        { code: "Giainganthauchi", name: "Giải ngân thấu chi" },
        { code: "Khoitaohanmuc", name: "Khởi tạo hạn mức" },
        { code: "NhapvaduyetFCC", name: "Nhập và duyệt bút toán FCC" },
        { code: "Khac", name: "Khác" },
    ];
    var STATES = [
        { code: "CHUA_HAU_KIEM", name: "HK - Chưa hậu kiểm" },
        { code: "CHO_XU_LY", name: "HK - Chờ xử lý" },
        { code: "CHO_BO_SUNG", name: "HK - Chờ bổ sung" },
        { code: "HOAN_THANH", name: "HK- Hoàn thành" }
    ];
    /* Luồng giao dịch (TRANSACTION_FLOW, tên lấy từ GNCN_CONFIG_COMMONS scope TRAN_FLOW) */
    var FLOWS = [
        { code: "TT", name: "Tập trung" },
        { code: "GD_DVKD", name: "GĐ ĐVKD" },
        { code: "DVKD", name: "VH ĐVKD" }
    ];
    var GROUPS = ["RB.TINH", "RB.HCM", "RB.HN", "DS.HN"];   /* GROUP_PROCESS: nhóm xử lý */
    var GN_APPROVERS = ["ngocnt5", "ducvm7", "lanpth2"];   /* GN_APPROVAL_BY: người duyệt giải ngân */
    var BRANCH_CODES = ["441", "360", "310", "520", "274", "810"];
    var USERS = ["LoanTT3", "HongHTD", "GiangNT6", "ThanhHM2", "ThuyNT66", "OanhNTK4"];

    /* Tên KH tiếng Việt (viết hoa như dữ liệu core). Họ phổ biến lặp lại để xuất hiện nhiều hơn. */
    var VN_NAME = {
        surnames: ["NGUYỄN", "NGUYỄN", "NGUYỄN", "NGUYỄN", "TRẦN", "TRẦN", "LÊ", "LÊ", "PHẠM", "HOÀNG",
            "HUỲNH", "PHAN", "VŨ", "VÕ", "ĐẶNG", "BÙI", "ĐỖ", "HỒ", "NGÔ", "DƯƠNG", "LÝ", "ĐINH",
            "TRỊNH", "ĐOÀN", "LÂM", "MAI", "CHÂU", "TÔ", "LƯU", "HÀ"],
        male: {
            middles: ["VĂN", "HỮU", "ĐỨC", "MINH", "QUANG", "HOÀNG", "CÔNG", "THÀNH", "XUÂN", "ĐÌNH",
                "TUẤN", "GIA", "BẢO", "NHẬT", "SỸ", "KHẮC", "TRỌNG", "HẢI", "THẾ", "ANH"],
            givens: ["AN", "BÌNH", "CƯỜNG", "DŨNG", "DUY", "ĐẠT", "HẢI", "HIẾU", "HÙNG", "HUY", "KHANG",
                "KHOA", "LONG", "LỘC", "MẠNH", "NAM", "NGHĨA", "PHONG", "PHÚC", "QUÂN", "SƠN", "TÀI",
                "THẮNG", "THỊNH", "TIẾN", "TOÀN", "TRUNG", "TUẤN", "VIỆT", "VINH", "CHIẾN", "HƯNG"]
        },
        female: {
            middles: ["THỊ", "NGỌC", "THU", "THANH", "MINH", "BẢO", "KIM", "HỒNG", "PHƯƠNG", "KHÁNH",
                "MỸ", "DIỆU", "HOÀI", "THẢO", "NHƯ", "CẨM", "TƯỜNG", "QUỲNH"],
            givens: ["ANH", "CHI", "DUNG", "GIANG", "HÀ", "HẠNH", "HIỀN", "HOA", "HƯƠNG", "HUYỀN", "LAN",
                "LINH", "LY", "MAI", "MY", "NGA", "NGÂN", "NHUNG", "OANH", "PHƯƠNG", "QUỲNH", "THẢO",
                "THƯ", "TRANG", "TRÂM", "UYÊN", "VÂN", "VY", "YẾN", "HÂN"]
        }
    };

    /* ---------------- Đo hiệu năng ---------------- */
    function now() {
        return window.performance && performance.now ? performance.now() : new Date().getTime();
    }
    var PERF = { genMs: 0, serverMs: 0 };

    /* Số bản ghi mock: DEMO_CONFIG.rows, URL ?rows=5000 ghi đè */
    var ROW_COUNT = (function () {
        var m = /[?&]rows=(\d+)/.exec(window.location.search);
        return m ? Math.max(1, parseInt(m[1], 10)) : DEMO_CONFIG.rows;
    })();

    /* Random có seed (mulberry32): cùng seed => cùng chuỗi số, dữ liệu demo ổn định khi F5 */
    function makeRandom(seed) {
        var s = seed >>> 0;
        return function () {
            s = (s + 0x6D2B79F5) >>> 0;
            var t = Math.imul(s ^ (s >>> 15), s | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    /* Bảng mock HKCN_TRANSACTION: mỗi phần tử là một dòng, key = tên cột trong bảng,
       cột DATE lưu số ms (giờ local). Chỉ SP mock bên dưới đọc bảng này. */
    var HKCN_TRANSACTION = [];
    function buildDataset() {
        var t0 = now();
        var rnd = makeRandom(DEMO_CONFIG.seed);
        function pick(list) { return list[Math.floor(rnd() * list.length)]; }
        /* Số nguyên ngẫu nhiên đều trong [min, max] */
        function randInt(min, max) { return min + Math.floor(rnd() * (max - min + 1)); }

        /* Tên KH tiếng Việt, số chữ ngẫu nhiên đều trong DEMO_CONFIG.nameWords [min, max], cùng giới tính:
             3 chữ: HỌ + ĐỆM + TÊN                 (HỒ SỸ THẮNG)
             4 chữ: HỌ + ĐỆM + ĐỆM + TÊN           (DƯƠNG THỊ HƯƠNG LY)
             5 chữ: HỌ + HỌ + ĐỆM + ĐỆM + TÊN      (LÊ NGUYỄN NGỌC BẢO TRÂM, họ ghép cha + mẹ)
           Không chữ nào lặp lại trong một tên. */
        var nameMin = Math.max(2, DEMO_CONFIG.nameWords[0]), nameMax = Math.max(nameMin, DEMO_CONFIG.nameWords[1]);
        function pickNew(list, used) {
            var n = list.length, k = Math.floor(rnd() * n), guard;
            for (guard = 0; guard < n && used.indexOf(list[k % n]) !== -1; guard++) { k += 7; }
            return list[k % n];
        }
        function mockName() {
            var g = rnd() < 0.5 ? VN_NAME.male : VN_NAME.female;
            var words = nameMin + Math.floor(rnd() * (nameMax - nameMin + 1));
            var parts = [pick(VN_NAME.surnames)], firstMiddle, m;
            if (words >= 5) { parts.push(pickNew(VN_NAME.surnames, parts)); }
            firstMiddle = parts.length;
            for (m = words - parts.length - 1; m > 0; m--) { parts.push(pickNew(g.middles, parts)); }
            /* "VĂN"/"THỊ" (phần tử đầu danh sách đệm) luôn đứng ngay sau họ: NGUYỄN THỊ NGỌC LAN */
            m = parts.indexOf(g.middles[0]);
            if (m > firstMiddle) { parts.splice(m, 1); parts.splice(firstMiddle, 0, g.middles[0]); }
            parts.push(pickNew(g.givens, parts));
            return parts.join(" ");
        }

        /* PA_STATUS theo trọng số DEMO_CONFIG.statusWeights */
        var weights = [], totalWeight = 0, k;
        for (k = 0; k < STATES.length; k++) {
            weights.push(Math.max(0, Number(DEMO_CONFIG.statusWeights[STATES[k].code]) || 0));
            totalWeight += weights[k];
        }
        function pickStatus() {
            var x = rnd() * totalWeight, j;
            for (j = 0; j < STATES.length; j++) {
                x -= weights[j];
                if (x < 0) { return STATES[j].code; }
            }
            return pick(STATES).code;   /* mọi trọng số = 0: chọn đều */
        }

        var rows = new Array(ROW_COUNT), base = new Date().getTime(), i;
        for (i = 1; i <= ROW_COUNT; i++) {
            var type = TYPE_CODES[i % TYPE_CODES.length].code;
            var status = pickStatus();
            var branch = BRANCH_CODES[i % BRANCH_CODES.length];
            var user = USERS[i % USERS.length];
            var amountRange = DEMO_CONFIG.amountRanges[type];
            var created = base - i * DEMO_CONFIG.gapMinutes * 60000;
            var createdDay = new Date(created);
            /* Đã tiếp nhận: SUBMIT_DATE ngẫu nhiên trong [lúc tạo, min(lúc tạo + maxSubmitMinutes, hiện tại)],
               cập nhật lần cuối 0..maxSubmitMinutes phút sau đó (không quá hiện tại) */
            var submitted = DEMO_CONFIG.unsubmittedStates.indexOf(status) === -1;
            var maxSubmit = Math.min(DEMO_CONFIG.maxSubmitMinutes, Math.floor((base - created) / 60000));
            var submit = submitted ? created + randInt(0, maxSubmit) * 60000 : null;
            rows[i - 1] = {
                ID: i,
                GNTD_CODE: "GNCN" + branch + "26" + pad(i % 12 + 1) + pad(i % 28 + 1) + pad(i % 1000, 3),
                PDTD_CODE: i % 4 === 0 ? "PD" + pad(i * 13 % 100000000, 8) : pad(i * 13 % 10000000, 7),
                BRANCH_CODE: branch,
                TRANSACTION_FLOW: pick(FLOWS).code,
                TRANS_LEVEL_CODE_1: type,
                TRANSACTION_TYPE2: null,
                TRANSACTION_TYPE3: null,
                CUSTOMER_CODE: pad(i * 7919 % 100000000, 8),
                CUSTOMER_NAME: mockName(),
                AMOUNT: amountRange ? randInt(amountRange[0], amountRange[1]) * 1000000 : null,
                PA_STATUS: status,
                USER_PA: submitted ? user : null,
                USER_ASSIGN: user.toLowerCase(),
                GROUP_PROCESS: pick(GROUPS),
                /* Hạn hậu kiểm: 00:00 của ngày tạo + paExpiryDays */
                PA_EXPIRY_DATE: new Date(createdDay.getFullYear(), createdDay.getMonth(), createdDay.getDate() +
                    randInt(DEMO_CONFIG.paExpiryDays[0], DEMO_CONFIG.paExpiryDays[1])).getTime(),
                /* Giao dịch được duyệt giải ngân 5..120 phút trước khi sang hậu kiểm */
                GN_APPROVAL_BY: pick(GN_APPROVERS),
                GN_APPROVAL_DATE: created - randInt(5, 120) * 60000,
                CREATED_DATE: created,
                UPDATED_BY: submitted ? user : null,
                UPDATED_DATE: submitted ? Math.min(base, submit + randInt(0, DEMO_CONFIG.maxSubmitMinutes) * 60000) : null,
                SUBMIT_DATE: submit
            };
        }
        HKCN_TRANSACTION = rows;
        PERF.genMs = now() - t0;
        log("Mock HKCN_TRANSACTION: " + ROW_COUNT.toLocaleString() + " rows, generated in " +
            Math.round(PERF.genMs) + " ms");
    }

    /* ============================================================
       Mock SP_GET_HK_TRANSACTION_PAGING trên bảng HKCN_TRANSACTION.
       Làm theo đúng thứ tự trong SP: đọc JSON -> WHERE -> COUNT (P_TOTAL) -> ORDER BY -> OFFSET/FETCH,
       rồi SELECT các cột của trang với alias và định dạng ngày như SP. Sửa SP thì sửa theo ở đây.
    ============================================================ */
    /* Field sort SP chấp nhận; giá trị khác về createdDate */
    var SP_SORT_FIELDS = ["createdDate", "taskStartTime", "_sla"];

    /* LEFT JOIN danh mục: { mã: tên }, không có mã thì tên = null */
    function nameMap(list) {
        var map = {}, i;
        for (i = 0; i < list.length; i++) { map[list[i].code] = list[i].name; }
        return map;
    }
    var TYPE_NAMES = nameMap(TYPE_CODES), STATUS_NAMES = nameMap(STATES), FLOW_NAMES = nameMap(FLOWS);
    function joinName(map, code) {
        return map.hasOwnProperty(code) ? map[code] : null;
    }

    /* TRIM(GET_STRING(...)): Oracle coi chuỗi rỗng là NULL */
    function spText(value) {
        var s = value === null || value === undefined ? "" : String(value).trim();
        return s === "" ? null : s;
    }

    /* NVL(GET_NUMBER(...), dflt) */
    function spNumber(value, dflt) {
        var n = Number(value);
        return value === null || value === undefined || isNaN(n) ? dflt : n;
    }

    /* TO_DATE(text, 'YYYY-MM-DD') + days -> số ms (00:00 giờ local) */
    function spDate(text, days) {
        var m = text === null ? null : DateUtil.parse(text);
        return m ? m.add(days, "days").valueOf() : null;
    }

    /* TO_CHAR(cột DATE, 'YYYY-MM-DD' | 'YYYY-MM-DD HH24:MI:SS'); NULL vẫn là null */
    function spChar(ms, dateOnly) {
        if (ms === null || ms === undefined) { return null; }
        var s = DateUtil.toServer(ms);
        return dateOnly ? s.slice(0, 10) : s;
    }

    /* So sánh như ORDER BY của Oracle: NULL lớn hơn mọi giá trị (ASC xuống cuối, DESC lên đầu) */
    function spCompare(a, b) {
        if (a === null || b === null) { return a === b ? 0 : a === null ? 1 : -1; }
        return a - b;
    }

    /* P_JSON_OBJECT (chuỗi JSON) -> { total: P_TOTAL, rows: OUT_DATA } */
    function mockSpGetHkTransactionPaging(jsonText) {
        var obj = jsonText ? JSON.parse(jsonText) : {};
        var sort = obj.sort && typeof obj.sort === "object" ? obj.sort : {};
        var f = obj.filters && typeof obj.filters === "object" ? obj.filters : {};
        var i, r, d;

        var page = Math.max(Math.floor(spNumber(obj.page, 1)), 1);
        var pageSize = Math.max(Math.floor(spNumber(obj.pageSize, 10)), 1);
        var sortField = spText(sort.field);
        var sortType = (spText(sort.type) || "").toUpperCase();
        if (SP_SORT_FIELDS.indexOf(sortField) === -1) { sortField = "createdDate"; }
        if (sortType !== "ASC" && sortType !== "DESC") { sortType = "DESC"; }

        var keyword = spText(f.keyword);
        var kw = keyword === null ? null : keyword.toUpperCase();
        var branch = spText(f.branch);
        var branchList = branch === null ? null : "," + branch.replace(/ /g, "") + ",";
        var type1 = spText(f.transactionType1);
        var status = spText(f.status);
        var statusList = status === null ? null : "," + status + ",";
        var dateFrom = spDate(spText(f.date_from), 0);
        var dateTo = spDate(spText(f.date_to), 1);   /* date_to + 1, so sánh < */

        function like(value) {   /* UPPER(cột) LIKE '%' || UPPER(V_KEYWORD) || '%' */
            return value !== null && String(value).toUpperCase().indexOf(kw) !== -1;
        }

        /* WHERE */
        var data = [];
        for (i = 0; i < HKCN_TRANSACTION.length; i++) {
            r = HKCN_TRANSACTION[i];
            if (kw !== null && !(like(r.GNTD_CODE) || like(r.PDTD_CODE) || like(r.CUSTOMER_CODE) ||
                    like(r.CUSTOMER_NAME) || like(r.USER_ASSIGN))) { continue; }
            if (branchList !== null && branchList.indexOf("," + r.BRANCH_CODE + ",") === -1) { continue; }
            if (type1 !== null && r.TRANS_LEVEL_CODE_1 !== type1) { continue; }
            if (statusList !== null && statusList.indexOf("," + r.PA_STATUS + ",") === -1) { continue; }
            d = r.PA_EXPIRY_DATE === null ? r.CREATED_DATE : r.PA_EXPIRY_DATE;   /* NVL(PA_EXPIRY_DATE, CREATED_DATE) */
            if (dateFrom !== null && d < dateFrom) { continue; }
            if (dateTo !== null && d >= dateTo) { continue; }
            data.push(r);
        }

        /* ORDER BY: taskStartTime -> NVL(SUBMIT_DATE, CREATED_DATE), createdDate -> PA_EXPIRY_DATE,
           _sla chưa có CASE nên không sort; sau cùng luôn CREATED_DATE DESC, ID DESC */
        var sortKey = sortField === "taskStartTime"
            ? function (row) { return row.SUBMIT_DATE === null ? row.CREATED_DATE : row.SUBMIT_DATE; }
            : sortField === "createdDate"
                ? function (row) { return row.PA_EXPIRY_DATE; }
                : function () { return null; };
        var dir = sortType === "ASC" ? 1 : -1;
        data.sort(function (a, b) {
            return spCompare(sortKey(a), sortKey(b)) * dir || b.CREATED_DATE - a.CREATED_DATE || b.ID - a.ID;
        });

        /* OFFSET / FETCH, rồi SELECT với alias của SP */
        var offset = (page - 1) * pageSize;
        var pageRows = data.slice(offset, offset + pageSize), out = [];
        for (i = 0; i < pageRows.length; i++) {
            r = pageRows[i];
            out.push({
                ID: r.ID,
                STATUS: r.PA_STATUS,
                STATUS_NAME: joinName(STATUS_NAMES, r.PA_STATUS),
                GNTD_CODE: r.GNTD_CODE,
                PDTD_CODE: r.PDTD_CODE,
                BRANCH_CODE: r.BRANCH_CODE,
                TRANSACTION_FLOW: r.TRANSACTION_FLOW,
                TRANSACTION_FLOW_NAME: joinName(FLOW_NAMES, r.TRANSACTION_FLOW),
                TRANSACTION_TYPE1: r.TRANS_LEVEL_CODE_1,
                TRANSACTION_TYPE1_NAME: joinName(TYPE_NAMES, r.TRANS_LEVEL_CODE_1),
                TRANSACTION_TYPE2: r.TRANSACTION_TYPE2,
                TRANSACTION_TYPE3: r.TRANSACTION_TYPE3,
                CUSTOMER_CODE: r.CUSTOMER_CODE,
                CUSTOMER_NAME: r.CUSTOMER_NAME,
                AMOUNT: r.AMOUNT,
                PROCESS_USER: r.USER_PA,
                ASSIGN_USER: r.USER_ASSIGN,
                GROUP_PROCESS: r.GROUP_PROCESS,
                PA_EXPIRY_DATE: spChar(r.PA_EXPIRY_DATE, true),
                GN_APPROVAL_BY: r.GN_APPROVAL_BY,
                GN_APPROVAL_DATE: spChar(r.GN_APPROVAL_DATE),
                CREATED_AT: spChar(r.CREATED_DATE),
                UPDATED_BY: r.UPDATED_BY,
                MODIFIED_AT: spChar(r.UPDATED_DATE),
                TASK_START_TIME: spChar(r.SUBMIT_DATE)
            });
        }
        return { total: data.length, rows: out };
    }

    /* ============================================================
       Mock service (thay bằng gọi API thật)
    ============================================================ */
    /* Giả lập gọi API danh mục: trả { error, lists: [{ code, name }] } sau `delay` ms */
    function mockCatalogApi(source, delay) {
        return function (callback) {
            setTimeout(function () {
                var lists = [], i;
                for (i = 0; i < source.length; i++) {
                    lists.push({ code: source[i].code, name: source[i].name });
                }
                callback({ error: null, lists: lists });
            }, delay);
        };
    }

    var transactionService = {
        /* Danh mục cho bộ lọc (mỗi API gọi độc lập, bất đồng bộ) */
        getTransactionTypes: mockCatalogApi(TYPE_CODES, 600),
        getProcessStates: mockCatalogApi(STATES, 800),

        /* Object phân quyền: { error, allowBranchs, visibleConfig } */
        getPermissions: function (callback) {
            setTimeout(function () {
                callback({
                    error: null,
                    allowBranchs: ["441", "360", "310", "520", "274"],
                    visibleConfig: { exportData: true }
                });
            }, 100);
        },

        /* Giả lập BE gọi SP_GET_HK_TRANSACTION_PAGING. Response: { error, total, count, lists },
           lists giữ key Oracle như SP (ID, GNTD_CODE...), client đổi sang camelCase trong mapResponse. */
        getHkTransactionPaging: function (request, permissions, callback) {
            setTimeout(function () {
                var t0 = now();
                var json = JSON.parse(JSON.stringify(request || {}));   /* P_JSON_OBJECT */
                var allowed = permissions.allowBranchs || [];
                json.filters = json.filters || {};
                var branchList = json.filters.branch ? String(json.filters.branch).split(",") : [];
                var i, res;

                /* Server kiểm tra lại quyền ĐVKD */
                for (i = 0; i < branchList.length; i++) {
                    if (allowed.indexOf(branchList[i]) === -1) {
                        callback({
                            error: { code: DISB_CONSTANTS.ERRORS.FORBIDDEN_BRANCH,
                                     message: "Bạn không có quyền với ĐVKD " + branchList[i] },
                            total: 0, count: 0, lists: []
                        });
                        return;
                    }
                }
                /* SP coi branch rỗng là không lọc ĐVKD, nên BE truyền danh sách ĐVKD được phân quyền */
                if (!branchList.length) {
                    if (!allowed.length) {
                        callback({ error: null, total: 0, count: 0, lists: [] });
                        return;
                    }
                    json.filters.branch = allowed.join(",");
                }

                res = mockSpGetHkTransactionPaging(JSON.stringify(json));
                PERF.serverMs = now() - t0;
                callback({ error: null, total: res.total, count: res.rows.length, lists: res.rows });
            }, 20);
        }
    };

    /* ============================================================
       Tải cấu hình JSON
    ============================================================ */
    var TableConfigAPI = {
        load: function (url, callback) {
            var request = new XMLHttpRequest();
            var requestUrl = url + (url.indexOf("?") === -1 ? "?" : "&") + "_=" + new Date().getTime();
            request.open("GET", requestUrl, true);
            request.setRequestHeader("Cache-Control", "no-cache, no-store, max-age=0");
            request.onreadystatechange = function () {
                if (request.readyState !== 4) { return; }
                if (request.status < 200 || request.status >= 300) {
                    callback(new Error("Cannot load table config (HTTP " + request.status + "): " + url));
                    return;
                }
                try {
                    var config = JSON.parse(request.responseText);
                    if (!config || !Array.isArray(config.columns) || !config.columns.length) {
                        callback(new Error("Table config must contain a non-empty columns array."));
                        return;
                    }
                    callback(null, config);
                } catch (e) {
                    callback(new Error("Invalid table config JSON: " + e.message));
                }
            };
            request.onerror = function () {
                callback(new Error("Network error while loading table config: " + url));
            };
            request.send(null);
        }
    };

    /* ============================================================
       Trạng thái trang (nạp từ config + phân quyền)
    ============================================================ */
    var PAGE_CONFIG = { detail: { url: "", target: "_self" }, sla: null, statusBadge: null };

    /* Dải màu trạng thái hợp lệ (mỗi màu là một class .disb-status-<màu> trong CSS) */
    var STATUS_TONES = ["default", "purple", "green", "orange", "red"];

    /* Màu badge của một hồ sơ theo statusBadge.tones[mã trạng thái]; sai/thiếu => defaultTone => "default" */
    function statusTone(row) {
        var cfg = PAGE_CONFIG.statusBadge || {};
        var tone = (cfg.tones || {})[row[cfg.codeField || "status"]];
        if (STATUS_TONES.indexOf(tone) === -1) { tone = cfg.defaultTone; }
        return STATUS_TONES.indexOf(tone) === -1 ? "default" : tone;
    }

    /* Báo trong log các mã cấu hình màu không có trong STATUS_TONES */
    function checkStatusTones(cfg) {
        var tones = (cfg && cfg.tones) || {}, bad = [], code;
        for (code in tones) {
            if (tones.hasOwnProperty(code) && STATUS_TONES.indexOf(tones[code]) === -1) {
                bad.push(code + "=" + tones[code]);
            }
        }
        if (bad.length) {
            log("statusBadge: màu không hợp lệ " + bad.join(", ") + " => dùng default. Màu hợp lệ: " + STATUS_TONES.join(", "));
        }
    }

    /* ---------------- SLA hậu kiểm (spec.md mục 6) ----------------
       Chỉ tính cho trạng thái thuộc sla.activeStates (các trạng thái chưa hoàn thành; rỗng = mọi trạng thái).
       days = ngày hạn (sla.dueField, mặc định paExpiryDate) - hôm nay, tính theo ngày lịch:
         days < 0                     -> "overdue" (cờ đỏ, quá hạn)
         0 <= days <= sla.yellowDays  -> "warning" (cờ vàng, gồm cả hạn là hôm nay)
         days > sla.yellowDays        -> "ok"      (cờ xanh)
       Trả { status, days, due } hoặc null (không tính SLA / thiếu hoặc sai ngày hạn). */
    var SLA_DEFAULT_YELLOW_DAYS = 3;
    function computeSla(row, cfg, today) {
        if (!cfg || !row) { return null; }
        var active = cfg.activeStates || [];
        if (active.length && active.indexOf(row[cfg.statusField || "status"]) === -1) { return null; }
        var due = DateUtil.startOfDay(row[cfg.dueField || "paExpiryDate"]);
        if (!due) { return null; }
        var days = Math.round(due.diff(today, "days", true));
        var yellowDays = typeof cfg.yellowDays === "number" && cfg.yellowDays >= 0 ? cfg.yellowDays : SLA_DEFAULT_YELLOW_DAYS;
        return { status: days < 0 ? "overdue" : days <= yellowDays ? "warning" : "ok", days: days, due: due };
    }

    var PERMISSIONS = { allowBranchs: [], visibleConfig: { exportData: false } };
    var table = null;
    var tableContainer = document.getElementById("tableContainer1");

    /* ============================================================
       Catalog: nạp danh mục bất đồng bộ, gọi API một lần.
       - Bắt đầu gọi ngay khi script chạy, song song với tải config/phân quyền.
       - Catalog.get(key, cb): có dữ liệu thì cb ngay, chưa có thì xếp hàng chờ.
       - Lỗi API: Toast lỗi, cb([]) để ô chọn rỗng nhưng form vẫn dùng được.
    ============================================================ */
    var Catalog = (function () {
        var store = {};

        function load(key, fetcher, title) {
            var entry = store[key] = { done: false, data: [], waiters: [] };
            fetcher(function (res) {
                if (!res || res.error) {
                    Toast.error((res && res.error && res.error.message) || "Không tải được danh mục", title);
                } else {
                    entry.data = res.lists || [];
                }
                entry.done = true;
                log("Catalog loaded: " + key + " (" + entry.data.length + ")");
                var w = entry.waiters, i;
                entry.waiters = [];
                for (i = 0; i < w.length; i++) { w[i](entry.data); }
            });
        }

        function get(key, callback) {
            var entry = store[key];
            if (!entry) { callback([]); return; }
            if (entry.done) { callback(entry.data); return; }
            entry.waiters.push(callback);
        }

        return { load: load, get: get };
    })();

    Catalog.load("transactionTypes", transactionService.getTransactionTypes, "Lỗi tải loại giao dịch");
    Catalog.load("processStates", transactionService.getProcessStates, "Lỗi tải trạng thái");

    /* Provider async cho js-table: chờ Catalog rồi setOptions -> js-table dựng lại <option> và cập nhật Select2 */
    function catalogProvider(key) {
        return function (field, setOptions) {
            Catalog.get(key, function (lists) {
                var out = [], i;
                for (i = 0; i < lists.length; i++) {
                    out.push({ value: lists[i].code, label: lists[i].name });
                }
                setOptions(out);
            });
        };
    }

    function toOptions(list, labelPrefix) {
        var out = [], i;
        for (i = 0; i < list.length; i++) {
            out.push({ value: list[i], label: (labelPrefix || "") + list[i] });
        }
        return out;
    }

    function showConfigError(message) {
        var el = document.createElement("div");
        el.className = "table-config-error";
        el.appendChild(document.createTextNode(message));
        tableContainer.appendChild(el);
        Toast.error(message, "Lỗi tải cấu hình");
    }

    /* Response API { error, total, count, lists } -> { total, page, data } của js-table.
       lists được chuẩn hoá key Oracle -> camelCase. Trả thêm error để caller hiển thị Toast. */
    function mapResponse(request, res) {
        res = res || {};
        if (res.error) {
            return { total: 0, page: request.page, data: [], error: res.error };
        }
        var lists = Array.isArray(res.lists) ? res.lists : [];
        return {
            total: typeof res.total === "number" ? res.total : lists.length,
            page: request.page,
            data: DisbUtil.normalizeRows(lists)
        };
    }

    function isBlank(value) {
        return value === null || value === undefined || value === "";
    }

    /* Dòng mã có nhãn dạng tag ([PDTD] 2628344); bỏ qua nếu không có giá trị */
    function metaLine(key, value) {
        if (isBlank(value)) { return ""; }
        return "<div class='disb-meta'><span class='disb-meta-key'>" + DisbUtil.escapeHtml(key) + "</span>" +
            "<span class='disb-meta-value'>" + DisbUtil.escapeHtml(value) + "</span></div>";
    }

    /* ---------------- Kiểm tra tên field SP trả về ----------------
       SP đặt sai alias (vd TRANSACTIONTYPE1NAME thay vì TRANSACTION_TYPE1_NAME) thì sau toCamel
       field bị thiếu và ô trên bảng trống. Cảnh báo một lần, kèm alias đúng cần trả. */

    /* Field dùng trong renderer nhưng không khai báo là "field" của cột */
    var RENDERER_FIELDS = ["pdtdCode", "customerCode"];

    function collectExpectedFields(config) {
        var seen = {}, out = [], i, j, cols = config.columns || [];
        function add(name) {
            if (name && name.charAt(0) !== "_" && !seen[name]) { seen[name] = true; out.push(name); }
        }
        for (i = 0; i < cols.length; i++) {
            add(cols[i].field);
            for (j = 0; cols[i].actions && j < cols[i].actions.length; j++) { add(cols[i].actions[j].textField); }
        }
        if (config.sla) {
            add(config.sla.statusField || "status");
            add(config.sla.dueField || "paExpiryDate");
        }
        if (config.statusBadge) { add(config.statusBadge.codeField || "status"); }
        for (i = 0; i < RENDERER_FIELDS.length; i++) { add(RENDERER_FIELDS[i]); }
        return out;
    }

    var missingFieldsWarned = false;
    function warnMissingFields(rows) {
        if (missingFieldsWarned || !rows || !rows.length) { return; }
        missingFieldsWarned = true;
        var missing = DisbUtil.findMissingFields(rows[0], PAGE_CONFIG.expectedFields || []);
        if (!missing.length) { return; }
        var parts = [], i;
        for (i = 0; i < missing.length; i++) {
            parts.push(missing[i].field + " (SP cần trả " + missing[i].oracleKey + ")");
        }
        var msg = "Thiếu field: " + parts.join(", ");
        log(msg);
        if (window.console && console.warn) { console.warn("[disb] " + msg, rows[0]); }
        Toast.warning("Dữ liệu thiếu " + missing.length + " field, xem log/console.", "Sai tên field");
    }

    /* ---------------- Chi tiết giao dịch ---------------- */
    function openDetail(row) {
        var url = DisbUtil.buildDetailUrl(PAGE_CONFIG.detail, row);
        if (!url) {
            Toast.error(DISB_CONSTANTS.MESSAGES.NO_DETAIL_URL, "Lỗi");
            return;
        }
        log("View detail: " + row.gntdCode + " -> " + url);
        if (!DisbUtil.openUrl(url, PAGE_CONFIG.detail.target)) {
            Toast.error(DISB_CONSTANTS.MESSAGES.UNSAFE_URL, "Lỗi");
        }
    }

    /* ---------------- Export (thay bằng exporter thật của dự án) ---------------- */
    function exportExcel(data) {
        log("Export: " + data.length + " rows");
    }

    /* ============================================================
       Khởi động: phân quyền -> config -> table
    ============================================================ */
    TableConfigAPI.load(DISB_CONSTANTS.CONFIG_URL, function (error, config) {
        if (error) { showConfigError(error.message); return; }

        PAGE_CONFIG.sla = config.sla || null;
        PAGE_CONFIG.statusBadge = config.statusBadge || null;
        checkStatusTones(PAGE_CONFIG.statusBadge);
        if (PAGE_CONFIG.sla && !(typeof PAGE_CONFIG.sla.yellowDays === "number" && PAGE_CONFIG.sla.yellowDays >= 0)) {
            log("sla.yellowDays phải là số ngày >= 0, đang dùng mặc định " + SLA_DEFAULT_YELLOW_DAYS);
        }
        buildDataset();
        PAGE_CONFIG.expectedFields = collectExpectedFields(config);
        if (config.detail) {
            if (typeof config.detail.url === "string") { PAGE_CONFIG.detail.url = config.detail.url; }
            if (typeof config.detail.target === "string") { PAGE_CONFIG.detail.target = config.detail.target; }
        }

        transactionService.getPermissions(function (res) {
            if (!res || res.error) {
                Toast.error((res && res.error && res.error.message) || "Không tải được phân quyền", "Lỗi phân quyền");
            } else {
                PERMISSIONS.allowBranchs = res.allowBranchs || [];
                PERMISSIONS.visibleConfig = res.visibleConfig || {};
                if (!PERMISSIONS.allowBranchs.length) {
                    Toast.warning(DISB_CONSTANTS.MESSAGES.NO_BRANCH, "Phân quyền");
                }
            }

            /* Lọc nút theo visibleConfig; thiếu key thì ẩn */
            var visible = [], b;
            for (b = 0; b < (config.buttons || []).length; b++) {
                var btn = config.buttons[b];
                if (!btn.visibleKey || PERMISSIONS.visibleConfig[btn.visibleKey] === true) {
                    visible.push(btn);
                }
            }
            config.buttons = visible;

            try {
                table = TableRenderer.fromConfig(config, {
                    containerId: "tableContainer1",
                    searchFunction: function (request, callback) {
                        transactionService.getHkTransactionPaging(request, PERMISSIONS, function (res) {
                            var mapped = mapResponse(request, res);
                            warnMissingFields(mapped.data);
                            if (mapped.error) {
                                Toast.error(mapped.error.message || "Có lỗi xảy ra", "Lỗi tải dữ liệu");
                            }
                            /* callback -> js-table render body + pagination đồng bộ, nên đo được thời gian render */
                            var tRender = now();
                            callback(mapped);
                            log("Perf: server(mock) " + Math.round(PERF.serverMs) + " ms, render " +
                                Math.round(now() - tRender) + " ms (" + mapped.data.length + " / " +
                                mapped.total.toLocaleString() + " rows)");
                        });
                    },
                    optionsProviders: {
                        branchOptions: function () {
                            return toOptions(PERMISSIONS.allowBranchs, null);
                        },
                        /* Async từ API danh mục */
                        transactionType1Options: catalogProvider("transactionTypes"),
                        statusOptions: catalogProvider("processStates")
                    },
                    renderers: {
                        sttRenderer: function (value, row, index) {
                            var st = table && table.state ? table.state : { page: 1, pageSize: 0 };
                            return String((st.page - 1) * st.pageSize + index + 1);
                        },
                        /* SLA theo hạn hậu kiểm (computeSla), style riêng trong hk-sla.css (.hk-sla-ok/warning/overdue).
                           Không tính SLA thì trả "" (trả undefined thì js-table in chữ "undefined"). */
                        slaRenderer: function (value, row) {
                            var r = computeSla(row, PAGE_CONFIG.sla, DateUtil.startOfDay(DateUtil.now()));
                            if (!r) { return ""; }
                            var icon = { ok: "fa-clock", warning: "fa-hourglass-half", overdue: "fa-exclamation-circle" }[r.status];
                            var text = r.days < 0 ? "Quá " + (-r.days) + " ngày"
                                : r.days === 0 ? "Hạn hôm nay" : "Còn " + r.days + " ngày";
                            var tip = "Hạn hậu kiểm: " + r.due.format(DateUtil.FORMAT.DISPLAY_DATE);
                            return "<div class='hk-sla hk-sla-" + r.status + "' title='" + DisbUtil.escapeHtml(tip) + "'>" +
                                "<i class='fas " + icon + "' aria-hidden='true'></i>" + DisbUtil.escapeHtml(text) +
                                "</div>";
                        },
                        /* Loại giao dịch cấp 1 / Mã PDTD */
                        transactionRenderer: function (value, row) {
                            return "<div class='disb-cell'>" +
                                "<div class='disb-cell-text'>" + DisbUtil.escapeHtml(row.transactionType1Name || "") + "</div>" +
                                metaLine("PDTD", row.pdtdCode) +
                                "</div>";
                        },
                        /* Trạng thái: badge màu theo mã trạng thái (config statusBadge) */
                        statusRenderer: function (value, row) {
                            if (isBlank(value)) { return ""; }
                            return "<span class='disb-status disb-status-" + statusTone(row) + "'>" +
                                DisbUtil.escapeHtml(value) + "</span>";
                        },
                        /* Khách hàng: tên KH / [MÃ KH] mã */
                        customerRenderer: function (value, row) {
                            return "<div class='disb-cell'>"
                                + "<div class='disb-cell-text disb-meta-value'>" + DisbUtil.escapeHtml(row.customerCode) + "</div>"
                                + "<div class='disb-cell-text'>" + DisbUtil.escapeHtml(row.customerName) + "</div>"
                                + "</div>";
                        },
                        /* Thời điểm: ngày / giờ hai dòng cho cột hẹp */
                        dateTimeRenderer: function (value) {
                            var m = DateUtil.parse(value);
                            if (!m) { return DisbUtil.escapeHtml(value); }
                            return "<div class='disb-cell'>" +
                                "<div class='disb-cell-text'>" + m.format(DateUtil.FORMAT.DISPLAY_DATE) + "</div>" +
                                "<div class='disb-cell-sub'>" + m.format(DateUtil.FORMAT.TIME) + "</div>" +
                                "</div>";
                        }
                    },
                    handlers: {
                        openTransactionDetail: function (row) { openDetail(row); },
                        exportExcel: function (tableInstance, menuItem) {
                            menuItem.disabled = true;
                            showLoading();
                            tableInstance.getAllData(function (data) {
                                hideLoading();
                                menuItem.disabled = false;
                                exportExcel(data);
                                Toast.success(data.length + " dòng sẵn sàng xuất file.", "Export");
                            });
                        },
                        onRowClick: function (row, index) { /* no-op */ },
                        onDataLoaded: function (response) {
                            log("Refresh: " + response.data.length + " / " + response.total + " dòng");
                        },
                        onSearchChanged: function (filters) {
                            log("Search: " + JSON.stringify(filters));
                        }
                    }
                });
            } catch (e) {
                Toast.error(e.message, "Lỗi khởi tạo table");
            }
        });
    });
    </script>
