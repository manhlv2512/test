<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách giao dịch giải ngân</title>
    <link rel="stylesheet" href="../../js-table/libs/font-awesome-5/css/all.min.css">
    <link rel="stylesheet" href="../../js-table/libs/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" href="../../js-table/libs/select2/select2.min.css">
    <link rel="stylesheet" href="../../js-table/libs/sweetalerts/sweetalert2.min.css">
    <link rel="stylesheet" href="../../js-table/dist/table.min.css">
    <!-- Style màn hình giải ngân; nạp sau table.min.css. Bản build: dist/disb.min.css -->
    <link rel="stylesheet" href="disb.css">
    <!-- Chỉ dùng cho trang demo local -->
    <style>
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 15px;
            background: #fafbfc;
            color: #222;
            overflow-x: hidden;

        .page-log {
            margin-top: 15px;
            padding: 10px 12px;
            background: #272c33;

</head>
<body>
    <div id="tableContainer"></div>
    <div class="page-log" id="log"></div>

    <script src="../../js-table/libs/jquery-3.6.0.min.js"></script>
    <script src="../../js-table/libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="../../js-table/libs/select2/select2.min.js"></script>
    <script src="../../js-table/libs/sweetalerts/sweetalert2.all.min.js"></script>
    <script src="../../js-table/dist/table.min.js"></script>
    <script src="../../js-table/libs/moment-with-locales.min.js"></script>
    <script src="date-util.js"></script>
    <script src="constants.js"></script>
    <script src="disb-util.js"></script>
    <script src="disb-sla.js"></script>
    <script>
    /* ---------------- Logging ---------------- */
    var logEl = document.getElementById("log");
    function log(msg) {
        logEl.innerHTML = "[" + DateUtil.format(DateUtil.now(), DateUtil.FORMAT.TIME) + "] " + DisbUtil.escapeHtml(msg) +
            "\n" + logEl.innerHTML;
    }

    function pad(n, len) {
        var s = String(n);
        while (s.length < (len || 2)) { s = "0" + s; }
        return s;
    }

    function filterArray(arr, predicate) {
        var out = [], i;
        for (i = 0; i < arr.length; i++) {
            if (predicate(arr[i])) { out.push(arr[i]); }
        }
        return out;
    }

    /* ============================================================
       CẤU HÌNH DEMO: sửa các giá trị dưới đây rồi F5
    ============================================================ */
    var DEMO_CONFIG = {
        rows: 1000000,           /* số hồ sơ mock; URL ?rows=5000 ghi đè giá trị này */
        seed: 2026,              /* giữ nguyên seed thì F5 vẫn ra cùng bộ dữ liệu; đổi số để ra bộ khác */
        gapMinutes: 10,          /* hồ sơ sau được tạo sớm hơn hồ sơ trước 10 phút (mới nhất ở đầu) */
        maxTransferMinutes: 120, /* taskStartTime = createdAt + ngẫu nhiên 0..120 phút (không quá hiện tại) */
        pendingRatio: 0.5,       /* tỷ lệ hồ sơ ở trạng thái tính SLA (sla.activeStates, vd Chờ xử lý) */
        yellowMinutes: 60,       /* yellowFlagDate = taskStartTime + 60 phút */
        redMinutes: 90,          /* redFlagDate    = taskStartTime + 90 phút */
        workingTime: true,       /* true: cộng theo giờ làm việc (sla.workingHours, holidays); false: cộng thẳng */
        /* Số tiền mock theo loại giao dịch cấp 1, khoảng [min, max] triệu đồng; loại khác không có số tiền */
        amountRanges: {
            Giaingankhoanvay: [50, 5000],
            Giainganthauchi: [10, 500],
            Khoitaohanmuc: [500, 20000]
        },
        usdRatio: 0.1,           /* tỷ lệ hồ sơ có loại tiền USD, còn lại VND */
        nameWords: [3, 5]        /* tên KH tiếng Việt ngẫu nhiên từ 3 đến 5 chữ (họ + đệm + tên) */
    };

    /* ============================================================
       Mock dataset
    ============================================================ */
    var TYPE_CODES = [
        { code: "Giaingankhoanvay", name: "Giải ngân khoản vay" },
        { code: "Giainganthauchi", name: "Giải ngân thấu chi" },
        { code: "Khoitaohanmuc", name: "Khởi tạo hạn mức" },
        { code: "NhapvaduyetFCC", name: "Nhập và duyệt bút toán FCC" },
        { code: "Khac", name: "Khác" },
    ];
    var FLOWS = [
        { code: "TT", name: "Tập trung" },
        { code: "GD_DVKD", name: "GĐ ĐVKD" },
        { code: "DVKD", name: "VH ĐVKD" }
    ];
    var STATES = [
        { code: "GNCN_KHOI_TAO", name: "GN - Khởi tạo" },
        { code: "GNCN_HUY", name: "GN - Hủy giao dịch" },
        { code: "GNCN_CHO_XU_LY", name: "GN - Chờ xử lý" },
        { code: "GNCN_CHO_BO_SUNG", name: "GN - Chờ bổ sung" },
        { code: "GNCN_DA_PHE_DUYET", name: "GN - Đã phê duyệt" },
        { code: "GNCN_LOI_HACH_TOAN_HAN_MUC", name: "GN - Lỗi hạch toán hạn mức" },
        { code: "GNCN_LOI_HACH_TOAN_KHOAN_VAY", name: "GN - Lỗi hạch toán khoản vay" },
        { code: "GNCN_LOI_HACH_TOAN_THAU_CHI", name: "GN - Lỗi hạch toán thấu chi" },
        { code: "GNCN_LOI_CHUYEN_TIEN", name: "GN - Lỗi chuyển tiền" },
        { code: "GNCN_HOAN_TAT_KHOAN_VAY", name: "GN - Hạch toán khoản vay thành công" },
        { code: "GNCN_HOAN_THANH", name: "GN - Hoàn thành" }
    ];
    /* Trạng thái kết thúc (như C_FINISHED_STATUS trong SP): không còn ai claim xử lý */
    var FINISHED_STATES = ["GNCN_HUY", "GNCN_HOAN_THANH"];
    var GROUPS = ["RB.TINH", "RB.HCM", "RB.HN", "DS.HN"];
    var BRANCH_CODES = ["441", "360", "310", "520", "274", "810"];
    var USERS = ["LoanTT3", "HongHTD", "GiangNT6", "ThanhHM2", "ThuyNT66", "OanhNTK4"];

    /* Tên KH tiếng Việt (viết hoa như dữ liệu core). Họ phổ biến lặp lại để xuất hiện nhiều hơn. */
    var VN_NAME = {
        surnames: ["NGUYỄN", "NGUYỄN", "NGUYỄN", "NGUYỄN", "TRẦN", "TRẦN", "LÊ", "LÊ", "PHẠM", "HOÀNG",
            "HUỲNH", "PHAN", "VŨ", "VÕ", "ĐẶNG", "BÙI", "ĐỖ", "HỒ", "NGÔ", "DƯƠNG", "LÝ", "ĐINH",
            "TRỊNH", "ĐOÀN", "LÂM", "MAI", "CHÂU", "TÔ", "LƯU", "HÀ"],
        male: {
            middles: ["VĂN", "HỮU", "ĐỨC", "MINH", "QUANG", "HOÀNG", "CÔNG", "THÀNH", "XUÂN", "ĐÌNH",
                "TUẤN", "GIA", "BẢO", "NHẬT", "SỸ", "KHẮC", "TRỌNG", "HẢI", "THẾ", "ANH"],
            givens: ["AN", "BÌNH", "CƯỜNG", "DŨNG", "DUY", "ĐẠT", "HẢI", "HIẾU", "HÙNG", "HUY", "KHANG",
                "KHOA", "LONG", "LỘC", "MẠNH", "NAM", "NGHĨA", "PHONG", "PHÚC", "QUÂN", "SƠN", "TÀI",
                "THẮNG", "THỊNH", "TIẾN", "TOÀN", "TRUNG", "TUẤN", "VIỆT", "VINH", "CHIẾN", "HƯNG"]
        },
        female: {
            middles: ["THỊ", "NGỌC", "THU", "THANH", "MINH", "BẢO", "KIM", "HỒNG", "PHƯƠNG", "KHÁNH",
                "MỸ", "DIỆU", "HOÀI", "THẢO", "NHƯ", "CẨM", "TƯỜNG", "QUỲNH"],
            givens: ["ANH", "CHI", "DUNG", "GIANG", "HÀ", "HẠNH", "HIỀN", "HOA", "HƯƠNG", "HUYỀN", "LAN",
                "LINH", "LY", "MAI", "MY", "NGA", "NGÂN", "NHUNG", "OANH", "PHƯƠNG", "QUỲNH", "THẢO",
                "THƯ", "TRANG", "TRÂM", "UYÊN", "VÂN", "VY", "YẾN", "HÂN"]
        }
    };

    /* ---------------- Đo hiệu năng ---------------- */
    function now() {
        return window.performance && performance.now ? performance.now() : new Date().getTime();
    }
    var PERF = { genMs: 0, serverMs: 0 };

    /* Số bản ghi mock: DEMO_CONFIG.rows, URL ?rows=5000 ghi đè */
    var ROW_COUNT = (function () {
        var m = /[?&]rows=(\d+)/.exec(window.location.search);
        return m ? Math.max(1, parseInt(m[1], 10)) : DEMO_CONFIG.rows;
    })();

    /* Random có seed (mulberry32): cùng seed => cùng chuỗi số, dữ liệu demo ổn định khi F5 */
    function makeRandom(seed) {
        var s = seed >>> 0;
        return function () {
            s = (s + 0x6D2B79F5) >>> 0;
            var t = Math.imul(s ^ (s >>> 15), s | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    /* Sinh dữ liệu mock. Gọi sau khi tải config vì cờ SLA cần sla.workingHours/holidays. */
    var DATASET = [];
    function buildDataset(slaCfg) {
        var t0 = now();
        var rnd = makeRandom(DEMO_CONFIG.seed);
        function pick(list) { return list[Math.floor(rnd() * list.length)]; }

        /* Tên KH tiếng Việt, số chữ ngẫu nhiên đều trong DEMO_CONFIG.nameWords [min, max], cùng giới tính:
             3 chữ: HỌ + ĐỆM + TÊN                 (HỒ SỸ THẮNG)
             4 chữ: HỌ + ĐỆM + ĐỆM + TÊN           (DƯƠNG THỊ HƯƠNG LY)
             5 chữ: HỌ + HỌ + ĐỆM + ĐỆM + TÊN      (LÊ NGUYỄN NGỌC BẢO TRÂM, họ ghép cha + mẹ)
           Không chữ nào lặp lại trong một tên. */
        var nameMin = Math.max(2, DEMO_CONFIG.nameWords[0]), nameMax = Math.max(nameMin, DEMO_CONFIG.nameWords[1]);
        function pickNew(list, used) {
            var n = list.length, k = Math.floor(rnd() * n), guard;
            for (guard = 0; guard < n && used.indexOf(list[k % n]) !== -1; guard++) { k += 7; }
            return list[k % n];
        }
        function mockName() {
            var g = rnd() < 0.5 ? VN_NAME.male : VN_NAME.female;
            var words = nameMin + Math.floor(rnd() * (nameMax - nameMin + 1));
            var parts = [pick(VN_NAME.surnames)], firstMiddle, m;
            if (words >= 5) { parts.push(pickNew(VN_NAME.surnames, parts)); }
            firstMiddle = parts.length;
            for (m = words - parts.length - 1; m > 0; m--) { parts.push(pickNew(g.middles, parts)); }
            /* "VĂN"/"THỊ" (phần tử đầu danh sách đệm) luôn đứng ngay sau họ: NGUYỄN THỊ NGỌC LAN */
            m = parts.indexOf(g.middles[0]);
            if (m > firstMiddle) { parts.splice(m, 1); parts.splice(firstMiddle, 0, g.middles[0]); }
            parts.push(pickNew(g.givens, parts));
            return parts.join(" ");
        }

        /* Trạng thái tính SLA lấy theo sla.activeStates để mock và cột SLA luôn khớp nhau.
           activeStates rỗng = mọi trạng thái đều tính SLA (giống DisbSla). */
        var activeCodes = (slaCfg && slaCfg.activeStates) || [];
        var pending = [], others = [], k;
        for (k = 0; k < STATES.length; k++) {
            (activeCodes.indexOf(STATES[k].code) !== -1 ? pending : others).push(STATES[k]);
        }
        function pickState() {
            return pending.length && (!others.length || rnd() < DEMO_CONFIG.pendingRatio)
                ? pick(pending) : pick(others);
        }
        function hasSla(code) {
            return !activeCodes.length || activeCodes.indexOf(code) !== -1;
        }
        function addMinutes(ms, minutes) {
            return DEMO_CONFIG.workingTime
                ? DisbSla.addWorkMinutes(ms, minutes, slaCfg)
                : ms + minutes * 60000;
        }
        /* Số tiền mock: loại có trong DEMO_CONFIG.amountRanges; ~usdRatio là USD (quy đổi 1 triệu đồng ≈ 40 USD) */
        function mockMoney(typeCode) {
            var range = DEMO_CONFIG.amountRanges[typeCode];
            if (!range) { return null; }
            var millions = range[0] + rnd() * (range[1] - range[0]);
            if (rnd() < DEMO_CONFIG.usdRatio) {
                return { amount: Math.round(millions * 40 * 100) / 100, currency: "USD" };
            }
            return { amount: Math.round(millions) * 1000000, currency: "VND" };
        }

        var rows = new Array(ROW_COUNT), base = new Date().getTime(), i;
        for (i = 1; i <= ROW_COUNT; i++) {
            var type = TYPE_CODES[i % TYPE_CODES.length];
            var flow = FLOWS[i % FLOWS.length];
            var state = pickState();
            var branch = BRANCH_CODES[i % BRANCH_CODES.length];
            var user = USERS[i % USERS.length];
            var createdMs = base - i * DEMO_CONFIG.gapMinutes * 60000;
            /* Thời điểm chuyển xử lý task: ngẫu nhiên đều trong [lúc tạo, min(lúc tạo + maxTransferMinutes, hiện tại)].
               Hồ sơ đang Khởi tạo chưa chuyển xử lý => lấy lúc tạo (như SP: NVL(PROCESSING_DATE, CREATED_DATE)). */
            var maxTransfer = Math.min(DEMO_CONFIG.maxTransferMinutes, Math.floor((base - createdMs) / 60000));
            var startMs = state.code === "GNCN_KHOI_TAO" ? createdMs
                : createdMs + Math.floor(rnd() * (maxTransfer + 1)) * 60000;
            var sla = hasSla(state.code);
            var yellowMs = sla ? addMinutes(startMs, DEMO_CONFIG.yellowMinutes) : null;
            var redMs = sla ? addMinutes(startMs, DEMO_CONFIG.redMinutes) : null;
            var money = mockMoney(type.code);
            rows[i - 1] = ({
                id: i,
                gntdCode: "GNCN" + branch + "26" + pad(i % 12 + 1) + pad(i % 28 + 1) + pad(i % 1000, 3),
                pdtdCode: i % 4 === 0 ? "PD" + pad(i * 13 % 100000000, 8) : pad(i * 13 % 10000000, 7),
                transactionType1: type.code,
                transactionType1Name: type.name,
                amount: money ? money.amount : null,
                currency: money ? money.currency : null,
                transactionFlow: flow.code,
                transactionFlowName: i % 3 === 0 ? "" : flow.name,
                branchCode: branch,
                customerCode: pad(i * 7919 % 100000000, 8),
                customerName: mockName(),
                status: state.code,
                statusName: state.name,
                createdBy: pick(USERS),          /* ngẫu nhiên, có thể khác processUser */
                processUser: user,
                assignUser: user.toLowerCase(),
                /* User đang claim xử lý: chỉ hồ sơ chưa kết thúc, ~30% có người claim */
                lockUser: FINISHED_STATES.indexOf(state.code) === -1 && rnd() < 0.3 ? pick(USERS).toLowerCase() : "",
                processGroup: i % 5 === 0 ? GROUPS[i % GROUPS.length] : "",
                /* Cờ SLA (BE trả): chỉ trạng thái tính SLA; vàng/đỏ = taskStartTime + yellowMinutes/redMinutes */
                yellowFlagDate: yellowMs === null ? null : DateUtil.toServer(yellowMs),
                redFlagDate: redMs === null ? null : DateUtil.toServer(redMs),
                taskStartTime: DateUtil.toServer(startMs),
                createdAt: DateUtil.toServer(createdMs)
            });
        }
        DATASET = rows;
        PERF.genMs = now() - t0;
        log("Mock dataset: " + ROW_COUNT.toLocaleString() + " rows, generated in " + Math.round(PERF.genMs) +
            " ms (vàng +" + DEMO_CONFIG.yellowMinutes + "p, đỏ +" + DEMO_CONFIG.redMinutes + "p, " +
            (DEMO_CONFIG.workingTime ? "theo giờ làm việc" : "cộng thẳng") + ")");
    }

    /* ============================================================
       Mock service (thay bằng gọi API thật)
    ============================================================ */
    function slaDuration(minutes) {
        return DisbSla.formatDuration(minutes, PAGE_CONFIG.sla);
    }

    /* Giả lập gọi API danh mục: trả { error, lists: [{ code, name }] } sau `delay` ms */
    function mockCatalogApi(source, delay) {
        return function (callback) {
            setTimeout(function () {
                var lists = [], i;
                for (i = 0; i < source.length; i++) {
                    lists.push(typeof source[i] === "string"
                        ? { code: source[i], name: source[i] }
                        : { code: source[i].code, name: source[i].name });
                }
                callback({ error: null, lists: lists });
            }, delay);
        };
    }

    var transactionService = {
        /* Danh mục cho bộ lọc (mỗi API gọi độc lập, bất đồng bộ) */
        getFlows: mockCatalogApi(FLOWS, 400),
        getTransactionTypes: mockCatalogApi(TYPE_CODES, 600),
        getProcessStates: mockCatalogApi(STATES, 800),
        getProcessGroups: mockCatalogApi(GROUPS, 1000),

        /* Object phân quyền: { error, allowBranchs, visibleConfig } */
        getPermissions: function (callback) {
            setTimeout(function () {
                callback({
                    error: null,
                    allowBranchs: ["441", "360", "310", "520", "274"],
                    visibleConfig: { create: true, export: true }
                });
            }, 100);
        },

        /* Response: { error, total, count, lists } */
        getDisbursementQueue: function (request, permissions, callback) {
            setTimeout(function () {
                var t0 = now();
                var f = request.filters || {};
                var allowed = permissions.allowBranchs || [];
                var branchList = f.branch ? String(f.branch).split(",") : null;
                var i;

                /* Server kiểm tra lại quyền ĐVKD */
                if (branchList) {
                    for (i = 0; i < branchList.length; i++) {
                        if (allowed.indexOf(branchList[i]) === -1) {
                            callback({
                                error: { code: DISB_CONSTANTS.ERRORS.FORBIDDEN_BRANCH,
                                         message: "Bạn không có quyền với ĐVKD " + branchList[i] },
                                total: 0, count: 0, lists: []
                            });
                            return;
                        }
                    }
                }
                var scope = branchList || allowed;
                var data = filterArray(DATASET, function (r) { return scope.indexOf(r.branchCode) !== -1; });

                if (f.keyword) {
                    var kw = String(f.keyword).toLowerCase();
                    data = filterArray(data, function (r) {
                        return (r.gntdCode + " " + r.pdtdCode + " " + r.customerCode + " " +
                            r.customerName + " " + r.processUser).toLowerCase().indexOf(kw) !== -1;
                    });
                }
                if (f.transactionType1) {
                    data = filterArray(data, function (r) { return r.transactionType1 === f.transactionType1; });
                }
                if (f.flow) {
                    data = filterArray(data, function (r) { return r.transactionFlow === f.flow; });
                }
                if (f.status) {
                    var states = String(f.status).split(",");
                    data = filterArray(data, function (r) { return states.indexOf(r.status) !== -1; });
                }
                if (f.processGroup) {
                    data = filterArray(data, function (r) { return r.processGroup === f.processGroup; });
                }
                /* Lọc "Thời điểm" theo thời điểm tiếp nhận (taskStartTime), giống SP */
                if (f.date_from) {
                    data = filterArray(data, function (r) { return r.taskStartTime.slice(0, 10) >= f.date_from; });
                }
                if (f.date_to) {
                    data = filterArray(data, function (r) { return r.taskStartTime.slice(0, 10) <= f.date_to; });
                }

                if (request.sort && request.sort.field && request.sort.type) {
                    var sf = request.sort.field, dir = request.sort.type === "DESC" ? -1 : 1;
                    /* Sort SLA = sort theo hạn xử lý (deadline). ASC: gấp/quá hạn lên đầu.
                       Hồ sơ không tính SLA (đã hoàn thành) để null => luôn xuống cuối.
                       BE thật cần trả/tính field slaDeadline để sort phía server. */
                    if (sf === "_sla") {
                        sf = "_slaDeadline";
                        for (i = 0; i < data.length; i++) {
                            if (data[i]._slaDeadline === undefined) {
                                data[i]._slaDeadline = DisbSla.deadlineOf(data[i], PAGE_CONFIG.sla);
                            }
                        }
                    }
                    /* data đã là mảng mới (từ filterArray) nên sort tại chỗ, không copy thêm */
                    data.sort(function (a, b) {
                        var av = a[sf], bv = b[sf];
                        /* null/rỗng luôn xuống cuối, bất kể chiều sort */
                        var an = av === null || av === undefined || av === "";
                        var bn = bv === null || bv === undefined || bv === "";
                        if (an || bn) { return an === bn ? 0 : an ? 1 : -1; }
                        return av < bv ? -dir : av > bv ? dir : 0;
                    });
                }

                var start = (request.page - 1) * request.pageSize;
                var lists = data.slice(start, start + request.pageSize);
                PERF.serverMs = now() - t0;
                callback({ error: null, total: data.length, count: lists.length, lists: lists });
            }, 20);
        }
    };

    /* ============================================================
       Tải cấu hình JSON
    ============================================================ */
    var TableConfigAPI = {
        load: function (url, callback) {
            var request = new XMLHttpRequest();
            var requestUrl = url + (url.indexOf("?") === -1 ? "?" : "&") + "_=" + new Date().getTime();
            request.open("GET", requestUrl, true);
            request.setRequestHeader("Cache-Control", "no-cache, no-store, max-age=0");
            request.onreadystatechange = function () {
                if (request.readyState !== 4) { return; }
                if (request.status < 200 || request.status >= 300) {
                    callback(new Error("Cannot load table config (HTTP " + request.status + "): " + url));
                    return;
                }
                try {
                    var config = JSON.parse(request.responseText);
                    if (!config || !Array.isArray(config.columns) || !config.columns.length) {
                        callback(new Error("Table config must contain a non-empty columns array."));
                        return;
                    }
                    callback(null, config);
                } catch (e) {
                    callback(new Error("Invalid table config JSON: " + e.message));
                }
            };
            request.onerror = function () {
                callback(new Error("Network error while loading table config: " + url));
            };
            request.send(null);
        }
    };

    /* ============================================================
       Trạng thái trang (nạp từ config + phân quyền)
    ============================================================ */
    var PAGE_CONFIG = { detail: { url: "", target: "_self" }, create: null, sla: null, statusBadge: null, amountDisplay: null };

    /* Số tiền theo locale vi-VN (1.500.000.000); số chữ số thập phân theo amountDisplay.decimals[loại tiền].
       Cache Intl.NumberFormat theo số chữ số thập phân để không tạo lại mỗi ô. */
    var AMOUNT_FORMATS = {};
    function formatAmount(amount, currency) {
        var dec = (PAGE_CONFIG.amountDisplay && PAGE_CONFIG.amountDisplay.decimals) || {};
        var digits = dec.hasOwnProperty(currency) ? dec[currency] : (dec.hasOwnProperty("default") ? dec["default"] : 0);
        if (!AMOUNT_FORMATS[digits]) {
            AMOUNT_FORMATS[digits] = new Intl.NumberFormat("vi-VN", {
                minimumFractionDigits: digits,
                maximumFractionDigits: digits
            });
        }
        return AMOUNT_FORMATS[digits].format(amount);
    }

    /* Chỉ hiện số tiền cho loại giao dịch trong amountDisplay.types (không khai báo types = mọi loại) */
    function amountHtml(row) {
        var cfg = PAGE_CONFIG.amountDisplay || {};
        var types = cfg.types;
        if (types && types.length && types.indexOf(row[cfg.typeField || "transactionType1"]) === -1) { return ""; }
        var amount = row[cfg.amountField || "amount"];
        if (isBlank(amount) || isNaN(+amount)) { return ""; }
        var currency = row[cfg.currencyField || "currency"] || "";
        return "<div class='disb-amount'><span class='disb-amount-value'>" + formatAmount(+amount, currency) + "</span>" +
            (currency ? "<span class='disb-meta-key'>" + DisbUtil.escapeHtml(currency) + "</span>" : "") + "</div>";
    }

    /* Dải màu trạng thái hợp lệ (mỗi màu là một class .disb-status-<màu> trong CSS) */
    var STATUS_TONES = ["default", "purple", "green", "orange", "red"];

    /* Màu badge của một hồ sơ theo statusBadge.tones[mã trạng thái]; sai/thiếu => defaultTone => "default" */
    function statusTone(row) {
        var cfg = PAGE_CONFIG.statusBadge || {};
        var tone = (cfg.tones || {})[row[cfg.codeField || "status"]];
        if (STATUS_TONES.indexOf(tone) === -1) { tone = cfg.defaultTone; }
        return STATUS_TONES.indexOf(tone) === -1 ? "default" : tone;
    }

    /* Báo trong log các mã cấu hình màu không có trong STATUS_TONES */
    function checkStatusTones(cfg) {
        var tones = (cfg && cfg.tones) || {}, bad = [], code;
        for (code in tones) {
            if (tones.hasOwnProperty(code) && STATUS_TONES.indexOf(tones[code]) === -1) {
                bad.push(code + "=" + tones[code]);
            }
        }
        if (bad.length) {
            log("statusBadge: màu không hợp lệ " + bad.join(", ") + " => dùng default. Màu hợp lệ: " + STATUS_TONES.join(", "));
        }
    }
    var PERMISSIONS = { allowBranchs: [], visibleConfig: { create: false, export: false } };
    var table = null;
    var tableContainer = document.getElementById("tableContainer");

    /* ============================================================
       Catalog: nạp danh mục bất đồng bộ, gọi API một lần.
       - Bắt đầu gọi ngay khi script chạy, song song với tải config/phân quyền.
       - Catalog.get(key, cb): có dữ liệu thì cb ngay, chưa có thì xếp hàng chờ.
       - Lỗi API: Toast lỗi, cb([]) để ô chọn rỗng nhưng form vẫn dùng được.
    ============================================================ */
    var Catalog = (function () {
        var store = {};

        function load(key, fetcher, title) {
            var entry = store[key] = { done: false, data: [], waiters: [] };
            fetcher(function (res) {
                if (!res || res.error) {
                    Toast.error((res && res.error && res.error.message) || "Không tải được danh mục", title);
                } else {
                    entry.data = res.lists || [];
                }
                entry.done = true;
                log("Catalog loaded: " + key + " (" + entry.data.length + ")");
                var w = entry.waiters, i;
                entry.waiters = [];
                for (i = 0; i < w.length; i++) { w[i](entry.data); }
            });
        }

        function get(key, callback) {
            var entry = store[key];
            if (!entry) { callback([]); return; }
            if (entry.done) { callback(entry.data); return; }
            entry.waiters.push(callback);
        }

        /* Lấy đồng bộ (dùng cho popup Khởi tạo); null nếu chưa tải xong */
        function peek(key) {
            return store[key] && store[key].done ? store[key].data : null;
        }

        return { load: load, get: get, peek: peek };
    })();

    Catalog.load("flows", transactionService.getFlows, "Lỗi tải phân luồng");
    Catalog.load("transactionTypes", transactionService.getTransactionTypes, "Lỗi tải loại giao dịch");
    Catalog.load("processStates", transactionService.getProcessStates, "Lỗi tải trạng thái");
    Catalog.load("processGroups", transactionService.getProcessGroups, "Lỗi tải nhóm xử lý");

    /* Provider async cho js-table: chờ Catalog rồi setOptions -> js-table dựng lại <option> và cập nhật Select2 */
    function catalogProvider(key) {
        return function (field, setOptions) {
            Catalog.get(key, function (lists) {
                var out = [], i;
                for (i = 0; i < lists.length; i++) {
                    out.push({ value: lists[i].code, label: lists[i].name });
                }
                setOptions(out);
            });
        };
    }

    /* Loại giao dịch cho popup Khởi tạo: danh sách từ API, icon/mô tả/url bổ sung từ config theo code.
       API chưa trả về thì dùng tạm create.types trong config. */
    function getCreateTypes() {
        var cfgTypes = (PAGE_CONFIG.create && PAGE_CONFIG.create.types) || [];

        var apiTypes = Catalog.peek("transactionTypes");
        if (!apiTypes || !apiTypes.length) { return cfgTypes; }
        var byCode = {}, out = [], i, k;
        for (i = 0; i < cfgTypes.length; i++) { byCode[cfgTypes[i].value] = cfgTypes[i]; }
        for (i = 0; i < apiTypes.length; i++) {
            var extra = byCode[apiTypes[i].code] || {};
            var item = {};
            for (k in extra) { if (extra.hasOwnProperty(k)) { item[k] = extra[k]; } }
            item.value = apiTypes[i].code;
            item.label = apiTypes[i].name || extra.label || apiTypes[i].code;
            out.push(item);
        }
        return out;
    }

    function toOptions(list, labelPrefix) {
        var out = [], i;
        for (i = 0; i < list.length; i++) {
            out.push({ value: list[i], label: (labelPrefix || "") + list[i] });
        }
        return out;
    }

    function showConfigError(message) {
        var el = document.createElement("div");
        el.className = "table-config-error";
        el.appendChild(document.createTextNode(message));
        tableContainer.appendChild(el);
        Toast.error(message, "Lỗi tải cấu hình");
    }

    /* Response API { error, total, count, lists } -> { total, page, data } của js-table.
       lists được chuẩn hoá key Oracle -> camelCase. Trả thêm error để caller hiển thị Toast. */
    function mapResponse(request, res) {
        res = res || {};
        if (res.error) {
            return { total: 0, page: request.page, data: [], error: res.error };
        }
        var lists = Array.isArray(res.lists) ? res.lists : [];
        return {
            total: typeof res.total === "number" ? res.total : lists.length,
            page: request.page,
            data: DisbUtil.normalizeRows(lists)
        };
    }

    function isBlank(value) {
        return value === null || value === undefined || value === "";
    }

    /* Dòng mã có nhãn dạng tag ([PDTD] 2628344); bỏ qua nếu không có giá trị */
    function metaLine(key, value) {
        if (isBlank(value)) { return ""; }
        return "<div class='disb-meta'><span class='disb-meta-key'>" + DisbUtil.escapeHtml(key) + "</span>" +
            "<span class='disb-meta-value'>" + DisbUtil.escapeHtml(value) + "</span></div>";
    }

    /* Chip nhỏ (lock, nhóm); title là tooltip */
    function chip(kind, iconClass, text, title) {
        if (isBlank(text)) { return ""; }
        return "<div><span class='disb-chip disb-chip-" + kind + "'" +
            (title ? " title='" + DisbUtil.escapeHtml(title) + "'" : "") + ">" +
            (iconClass ? "<i class='fas " + iconClass + "' aria-hidden='true'></i>" : "") +
            DisbUtil.escapeHtml(text) + "</span></div>";
    }

    /* Click bất kỳ đâu trong ô Mã GNTD (link, chip lock, khoảng trống) => mở chi tiết.
       Tra dòng theo data-index của link trong ô (index trên trang hiện tại). */
    tableContainer.addEventListener("click", function (event) {
        var cell = event.target.closest ? event.target.closest("td.disb-col-gntd") : null;
        var link = cell ? cell.querySelector(".disb-detail-link") : null;
        if (!link || !table) { return; }
        event.preventDefault(); /* link href="#" không nhảy lên đầu trang */
        /* Đang bôi đen để copy mã thì không mở chi tiết */
        if (window.getSelection && String(window.getSelection()).length) { return; }
        var row = (table.currentData || [])[parseInt(link.getAttribute("data-index"), 10)];
        if (row) { openDetail(row); }
    });

    /* ---------------- Kiểm tra tên field SP trả về ----------------
       SP đặt sai alias (vd TRANSACTIONTYPE1NAME thay vì TRANSACTION_TYPE1_NAME) thì sau toCamel
       field bị thiếu và ô trên bảng trống. Cảnh báo một lần, kèm alias đúng cần trả. */

    /* Field dùng trong renderer nhưng không khai báo là "field" của cột */
    var RENDERER_FIELDS = ["pdtdCode", "customerCode", "processGroup", "lockUser"];

    function collectExpectedFields(config) {
        var seen = {}, out = [], i, j, cols = config.columns || [];
        function add(name) {
            if (name && name.charAt(0) !== "_" && !seen[name]) { seen[name] = true; out.push(name); }
        }
        for (i = 0; i < cols.length; i++) {
            add(cols[i].field);
            for (j = 0; cols[i].actions && j < cols[i].actions.length; j++) { add(cols[i].actions[j].textField); }
        }
        if (config.sla) {
            add(config.sla.statusField || "status");
            add(config.sla.yellowField || "yellowFlagDate");
            add(config.sla.redField || "redFlagDate");
            add(config.sla.startField);
        }
        if (config.statusBadge) { add(config.statusBadge.codeField || "status"); }
        if (config.amountDisplay) {
            add(config.amountDisplay.currencyField || "currency");
            add(config.amountDisplay.typeField || "transactionType1");
        }
        for (i = 0; i < RENDERER_FIELDS.length; i++) { add(RENDERER_FIELDS[i]); }
        return out;
    }

    var missingFieldsWarned = false;
    function warnMissingFields(rows) {
        if (missingFieldsWarned || !rows || !rows.length) { return; }
        missingFieldsWarned = true;
        var missing = DisbUtil.findMissingFields(rows[0], PAGE_CONFIG.expectedFields || []);
        if (!missing.length) { return; }
        var parts = [], i;
        for (i = 0; i < missing.length; i++) {
            parts.push(missing[i].field + " (SP cần trả " + missing[i].oracleKey + ")");
        }
        var msg = "Thiếu field: " + parts.join(", ");
        log(msg);
        if (window.console && console.warn) { console.warn("[disb] " + msg, rows[0]); }
        Toast.warning("Dữ liệu thiếu " + missing.length + " field, xem log/console.", "Sai tên field");
    }

    /* ---------------- Chi tiết giao dịch ---------------- */
    function openDetail(row) {
        var url = DisbUtil.buildDetailUrl(PAGE_CONFIG.detail, row);
        if (!url) {
            Toast.error(DISB_CONSTANTS.MESSAGES.NO_DETAIL_URL, "Lỗi");
            return;
        }
        log("View detail: " + row.gntdCode + " -> " + url);
        if (!DisbUtil.openUrl(url, PAGE_CONFIG.detail.target)) {
            Toast.error(DISB_CONSTANTS.MESSAGES.UNSAFE_URL, "Lỗi");
        }
    }

    /* ---------------- Popup Khởi tạo ---------------- */
    function openCreatePopup() {
        var cfg = PAGE_CONFIG.create || {};
        var types = getCreateTypes();
        var cols = Math.min(4, Math.max(1, cfg.columns || 3));
        var i, html;

        if (!types.length) {
            html = "<div class='disb-type-empty'>" +
                DisbUtil.escapeHtml(DISB_CONSTANTS.MESSAGES.NO_CREATE_TYPES) + "</div>";
        } else {
            html = "<div class='disb-type-grid' style='grid-template-columns:repeat(" + cols + ",minmax(0,1fr))'>";
            for (i = 0; i < types.length; i++) {
                html += "<button type='button' class='disb-type-card' data-index='" + i + "'" +
                    (types[i].disabled ? " disabled" : "") + ">" +
                    (types[i].iconClass
                        ? "<i class='disb-type-icon " + DisbUtil.escapeHtml(types[i].iconClass) + "' aria-hidden='true'></i>" : "") +
                    "<span class='disb-type-label'>" + DisbUtil.escapeHtml(types[i].label) + "</span>" +
                    (types[i].description
                        ? "<span class='disb-type-desc'>" + DisbUtil.escapeHtml(types[i].description) + "</span>" : "") +
                    "</button>";
            }
            html += "</div>";
        }

        Swal.fire({
            title: cfg.title || "Chọn loại giao dịch",
            width: 760,
            position: "top",
            html: html,
            showCloseButton: true,
            showConfirmButton: false,
            customClass: {
                container: "disb-swal-container",
                popup: "disb-swal-popup",
                title: "disb-swal-title",
                htmlContainer: "disb-swal-html"
            },
            didOpen: function (popup) {
                var cards = popup.querySelectorAll(".disb-type-card");
                var n;
                for (n = 0; n < cards.length; n++) {
                    cards[n].addEventListener("click", function () {
                        var type = types[parseInt(this.getAttribute("data-index"), 10)];
                        var url = DisbUtil.buildCreateUrl(cfg, type);
                        Swal.close();
                        log("Create: transactionType1=" + (type.value || "") + " -> " + url);
                        if (!url || !DisbUtil.openUrl(url, type.target || cfg.target)) {
                            Toast.error(DISB_CONSTANTS.MESSAGES.UNSAFE_URL, "Lỗi");
                        }
                    });
                }
            }
        });
    }

    /* ---------------- Export (thay bằng exporter thật của dự án) ---------------- */
    function exportExcel(data) {
        log("Export: " + data.length + " rows");
    }

    /* ============================================================
       Khởi động: phân quyền -> config -> table
    ============================================================ */
    TableConfigAPI.load(DISB_CONSTANTS.CONFIG_URL, function (error, config) {
        if (error) { showConfigError(error.message); return; }

        PAGE_CONFIG.create = config.create || null;
        PAGE_CONFIG.sla = config.sla || null;
        PAGE_CONFIG.statusBadge = config.statusBadge || null;
        PAGE_CONFIG.amountDisplay = config.amountDisplay || null;
        checkStatusTones(PAGE_CONFIG.statusBadge);
        if (PAGE_CONFIG.sla && !(Array.isArray(PAGE_CONFIG.sla.weekDays) && PAGE_CONFIG.sla.weekDays.length === 7)) {
            Toast.error("sla.weekDays phải có đủ 7 thứ, bắt đầu từ Chủ nhật. Cột SLA sẽ để trống.", "Lỗi cấu hình SLA");
        }
        buildDataset(PAGE_CONFIG.sla);
        PAGE_CONFIG.expectedFields = collectExpectedFields(config);
        if (config.detail) {
            if (typeof config.detail.url === "string") { PAGE_CONFIG.detail.url = config.detail.url; }
            if (typeof config.detail.target === "string") { PAGE_CONFIG.detail.target = config.detail.target; }
        }

        transactionService.getPermissions(function (res) {
            if (!res || res.error) {
                Toast.error((res && res.error && res.error.message) || "Không tải được phân quyền", "Lỗi phân quyền");
            } else {
                PERMISSIONS.allowBranchs = res.allowBranchs || [];
                PERMISSIONS.visibleConfig = res.visibleConfig || {};
                if (!PERMISSIONS.allowBranchs.length) {
                    Toast.warning(DISB_CONSTANTS.MESSAGES.NO_BRANCH, "Phân quyền");
                }
            }

            /* Lọc nút theo visibleConfig; thiếu key thì ẩn */
            var visible = [], b;
            for (b = 0; b < (config.buttons || []).length; b++) {
                var btn = config.buttons[b];
                if (!btn.visibleKey || PERMISSIONS.visibleConfig[btn.visibleKey] === true) {
                    visible.push(btn);
                }
            }
            config.buttons = visible;

            try {
                table = TableRenderer.fromConfig(config, {
                    containerId: "tableContainer",
                    searchFunction: function (request, callback) {
                        transactionService.getDisbursementQueue(request, PERMISSIONS, function (res) {
                            var mapped = mapResponse(request, res);
                            warnMissingFields(mapped.data);
                            if (mapped.error) {
                                Toast.error(mapped.error.message || "Có lỗi xảy ra", "Lỗi tải dữ liệu");
                            }
                            /* callback -> js-table render body + pagination đồng bộ, nên đo được thời gian render */
                            var tRender = now();
                            callback(mapped);
                            log("Perf: server(mock) " + Math.round(PERF.serverMs) + " ms, render " +
                                Math.round(now() - tRender) + " ms (" + mapped.data.length + " / " +
                                mapped.total.toLocaleString() + " rows)");
                        });
                    },
                    optionsProviders: {
                        branchOptions: function () {
                            return toOptions(PERMISSIONS.allowBranchs, "CN ");
                        },
                        /* Async từ API danh mục; transactionTypes dùng chung với popup Khởi tạo */
                        flowOptions: catalogProvider("flows"),
                        transactionType1Options: catalogProvider("transactionTypes"),
                        statusOptions: catalogProvider("processStates"),
                        processGroupOptions: catalogProvider("processGroups")
                    },
                    renderers: {
                        sttRenderer: function (value, row, index) {
                            var st = table && table.state ? table.state : { page: 1, pageSize: 0 };
                            return String((st.page - 1) * st.pageSize + index + 1);
                        },
                        slaRenderer: function (value, row) {
                            var r = DisbSla.compute(row, PAGE_CONFIG.sla, new Date());
                            if (!r) { return ""; }
                            var icon = { ok: "fa-clock", warning: "fa-hourglass-half", overdue: "fa-exclamation-circle" }[r.status];
                            var text = r.status === "overdue"
                                ? "Quá " + slaDuration(r.overMinutes)
                                : "Còn " + slaDuration(r.remainingMinutes);
                            /* Thanh tiến độ: % giờ làm việc đã dùng (null nếu thiếu thời điểm bắt đầu) */
                            var pct = r.progress === null ? (r.status === "overdue" ? 100 : 0) : r.progress;
                            var tip = "Cảnh báo từ: " + DateUtil.format(r.warningAt) +
                                "\nHạn xử lý: " + DateUtil.format(r.deadline) +
                                (r.progress === null ? "" : "\nĐã dùng: " + r.progress + "%");
                            return "<div class='disb-sla disb-sla-" + r.status + "' title='" + DisbUtil.escapeHtml(tip) + "'>" +
                                "<span class='disb-sla-text'><i class='fas " + icon + "' aria-hidden='true'></i>" +
                                DisbUtil.escapeHtml(text) + "</span>" +
                                "<span class='disb-sla-bar'><span style='width:" + pct + "%'></span></span>" +
                                "</div>";
                        },
                        /* Mã GNTD (link mở chi tiết) + user đang claim xử lý (lockUser) */
                        gntdRenderer: function (value, row, index) {
                            return "<div class='disb-cell'>" +
                                "<a href='#' class='tr-action-link tr-transaction-link disb-detail-link'" +
                                " data-index='" + index + "' title='Xem chi tiết giao dịch'>" +
                                DisbUtil.escapeHtml(row.gntdCode) + "</a>" +
                                chip("lock", "fa-lock", row.lockUser, "Đang claim xử lý: " + row.lockUser) +
                                "</div>";
                        },
                        /* Loại giao dịch cấp 1 / Mã PDTD */
                        transactionRenderer: function (value, row) {
                            return "<div class='disb-cell'>" +
                                "<div class='disb-cell-text'>" + DisbUtil.escapeHtml(row.transactionType1Name || "") + "</div>" +
                                metaLine("PDTD", row.pdtdCode) +
                                "</div>";
                        },
                        /* Phân luồng / Nhóm xử lý */
                        flowGroupRenderer: function (value, row) {
                            var flowName = row.transactionFlowName || row.flowName;
                            return "<div class='disb-cell'>" +
                                (isBlank(flowName) ? "" : "<div class='disb-cell-text'>" + DisbUtil.escapeHtml(flowName) + "</div>") +
                                chip("group", "fa-users", row.processGroup, "Nhóm xử lý: " + row.processGroup) +
                                "</div>";
                        },
                        /* Số tiền + loại tiền (config amountDisplay) */
                        amountRenderer: function (value, row) {
                            return amountHtml(row);
                        },
                        /* Trạng thái: badge màu theo mã trạng thái (config statusBadge) */
                        statusRenderer: function (value, row) {
                            if (isBlank(value)) { return ""; }
                            return "<span class='disb-status disb-status-" + statusTone(row) + "'>" +
                                DisbUtil.escapeHtml(value) + "</span>";
                        },
                        /* Khách hàng: tên KH / [MÃ KH] mã */
                        customerRenderer: function (value, row) {
                            return "<div class='disb-cell'>" +
                                (isBlank(row.customerName) ? "" : "<div class='disb-cell-text'>" + DisbUtil.escapeHtml(row.customerName) + "</div>") +
                                metaLine("Mã KH", row.customerCode) +
                                "</div>";
                        },
                        /* Thời điểm: ngày / giờ hai dòng cho cột hẹp */
                        dateTimeRenderer: function (value) {
                            var m = DateUtil.parse(value);
                            if (!m) { return DisbUtil.escapeHtml(value); }
                            return "<div class='disb-cell'>" +
                                "<div class='disb-cell-text'>" + m.format(DateUtil.FORMAT.DISPLAY_DATE) + "</div>" +
                                "<div class='disb-cell-sub'>" + m.format(DateUtil.FORMAT.TIME) + "</div>" +
                                "</div>";
                        }
                    },
                    handlers: {
                        viewProcessLog: function (row) {
                            log("Log xử lý: " + row.gntdCode);
                            Toast.info("Xem log xử lý giao dịch " + row.gntdCode, "Log xử lý");
                        },
                        openCreatePopup: function () { openCreatePopup(); },
                        exportExcel: function (tableInstance, menuItem) {
                            menuItem.disabled = true;
                            showLoading();
                            tableInstance.getAllData(function (data) {
                                hideLoading();
                                menuItem.disabled = false;
                                exportExcel(data);
                                Toast.success(data.length + " dòng sẵn sàng xuất file.", "Export");
                            });
                        },
                        onRowClick: function (row, index) { /* no-op */ },
                        onDataLoaded: function (response) {
                            log("Refresh: " + response.data.length + " / " + response.total + " dòng");
                        },
                        onSearchChanged: function (filters) {
                            log("Search: " + JSON.stringify(filters));
                        }
                    }
                });
            } catch (e) {
                Toast.error(e.message, "Lỗi khởi tạo table");
            }
        });
    });
    </script>
</body>
</html>
