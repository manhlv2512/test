<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Modal Viewer - ES5</title>
  <link rel="stylesheet" href="json-modal.css?v=2">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      color: #d8dee9;
      background:
        radial-gradient(circle at top left, rgba(88, 166, 255, 0.18), transparent 34%),
        radial-gradient(circle at bottom right, rgba(163, 113, 247, 0.16), transparent 30%),
        #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    .demo-card {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      overflow: hidden;
      background: rgba(22, 27, 34, 0.96);
      border: 1px solid #30363d;
      border-radius: 16px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
    }

    .demo-header {
      padding: 24px 26px 18px;
      border-bottom: 1px solid #30363d;
    }

    .demo-badge {
      display: inline-block;
      margin-bottom: 10px;
      padding: 4px 9px;
      color: #79c0ff;
      background: rgba(56, 139, 253, 0.12);
      border: 1px solid rgba(56, 139, 253, 0.35);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .demo-title {
      margin: 0 0 8px;
      color: #f0f6fc;
      font-size: 26px;
    }

    .demo-description {
      margin: 0;
      color: #8b949e;
      line-height: 1.6;
    }

    .demo-body {
      padding: 24px 26px 26px;
    }

    .field-label {
      display: block;
      margin-bottom: 9px;
      color: #c9d1d9;
      font-size: 14px;
      font-weight: 650;
    }

    .json-input {
      display: block;
      width: 100%;
      min-height: 360px;
      resize: vertical;
      padding: 16px;
      color: #d4d4d4;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      outline: none;
      font-family: Monaco, Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1.55;
      tab-size: 2;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .json-input:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.18);
    }

    .demo-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
    }

    .demo-hint {
      color: #8b949e;
      font-size: 13px;
    }

    .primary-button {
      flex: 0 0 auto;
      padding: 11px 18px;
      color: #fff;
      background: linear-gradient(135deg, #238636, #2ea043);
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(35, 134, 54, 0.24);
    }

    .primary-button:hover {
      background: linear-gradient(135deg, #2ea043, #3fb950);
    }

    .primary-button:focus {
      outline: 2px solid #58a6ff;
      outline-offset: 2px;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px 10px;
      }

      .demo-header,
      .demo-body {
        padding-right: 18px;
        padding-left: 18px;
      }

      .demo-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .primary-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="demo-card">
    <header class="demo-header">
      <span class="demo-badge">JavaScript ES5</span>
      <h1 class="demo-title">JSON Modal Viewer</h1>
      <p class="demo-description">
        Sửa chuỗi JSON bên dưới rồi nhấn nút để xem dữ liệu đã format và tô màu trong modal.
      </p>
    </header>

    <section class="demo-body">
      <label class="field-label" for="jsonInput">Chuỗi JSON</label>
      <textarea id="jsonInput" class="json-input" spellcheck="false">{
  "status": "success",
  "message": "Triển khai hoàn tất",
  "server": {
    "host": "192.168.1.69",
    "environment": "production",
    "region": "ap-southeast-1"
  },
  "services": [
    {
      "name": "shell-api",
      "port": 8000,
      "healthy": true
    },
    {
      "name": "worker",
      "port": 8001,
      "healthy": true
    }
  ],
  "duration_ms": 1248,
  "metadata": null
}</textarea>

      <div class="demo-actions">
        <span class="demo-hint">Modal có thể đóng bằng nút ×, nút Đóng, phím ESC hoặc click ra ngoài.</span>
        <span>
          <button id="openJsonModal" class="primary-button" type="button">Xem JSON (dark)</button>
          <button id="openJsonModalPurple" class="primary-button" type="button">Xem JSON (purple)</button>
        </span>
      </div>
    </section>
  </main>

  <script src="json-modal.js?v=2"></script>
  <script>
    function openModal(theme) {
      JsonModal.show(document.getElementById("jsonInput").value, {
        title: "Kết quả JSON",
        fileName: "deploy-result",
        theme: theme
      });
    }
    document.getElementById("openJsonModal").onclick = function () { openModal("dark"); };
    document.getElementById("openJsonModalPurple").onclick = function () { openModal("purple"); };
  </script>
</body>
</html>
