<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Modal Viewer - ES5</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      color: #d8dee9;
      background:
        radial-gradient(circle at top left, rgba(88, 166, 255, 0.18), transparent 34%),
        radial-gradient(circle at bottom right, rgba(163, 113, 247, 0.16), transparent 30%),
        #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    .demo-card {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      overflow: hidden;
      background: rgba(22, 27, 34, 0.96);
      border: 1px solid #30363d;
      border-radius: 16px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
    }

    .demo-header {
      padding: 24px 26px 18px;
      border-bottom: 1px solid #30363d;
    }

    .demo-badge {
      display: inline-block;
      margin-bottom: 10px;
      padding: 4px 9px;
      color: #79c0ff;
      background: rgba(56, 139, 253, 0.12);
      border: 1px solid rgba(56, 139, 253, 0.35);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .demo-title {
      margin: 0 0 8px;
      color: #f0f6fc;
      font-size: 26px;
    }

    .demo-description {
      margin: 0;
      color: #8b949e;
      line-height: 1.6;
    }

    .demo-body {
      padding: 24px 26px 26px;
    }

    .field-label {
      display: block;
      margin-bottom: 9px;
      color: #c9d1d9;
      font-size: 14px;
      font-weight: 650;
    }

    .json-input {
      display: block;
      width: 100%;
      min-height: 360px;
      resize: vertical;
      padding: 16px;
      color: #d4d4d4;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      outline: none;
      font-family: Monaco, Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1.55;
      tab-size: 2;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .json-input:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.18);
    }

    .demo-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
    }

    .demo-hint {
      color: #8b949e;
      font-size: 13px;
    }

    .primary-button,
    .secondary-button,
    .icon-button {
      border: 0;
      cursor: pointer;
    }

    .primary-button {
      flex: 0 0 auto;
      padding: 11px 18px;
      color: #fff;
      background: linear-gradient(135deg, #238636, #2ea043);
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 8px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(35, 134, 54, 0.24);
    }

    .primary-button:hover {
      background: linear-gradient(135deg, #2ea043, #3fb950);
    }

    .primary-button:focus,
    .secondary-button:focus,
    .icon-button:focus {
      outline: 2px solid #58a6ff;
      outline-offset: 2px;
    }

    .secondary-button {
      padding: 8px 14px;
      color: #c9d1d9;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 7px;
      font-weight: 650;
    }

    .secondary-button:hover {
      color: #f0f6fc;
      background: #30363d;
    }

    .json-modal {
      position: fixed;
      z-index: 99999;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      background: rgba(1, 4, 9, 0.78);
      backdrop-filter: blur(5px);
      transition: opacity 0.18s ease, visibility 0.18s ease;
    }

    .json-modal.is-open {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    .json-modal-dialog {
      display: flex;
      flex-direction: column;
      width: 960px;
      max-width: 100%;
      max-height: 90vh;
      overflow: hidden;
      background: #161b22;
      border: 1px solid #484f58;
      border-radius: 13px;
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.7);
      transform: translateY(12px) scale(0.985);
      transition: transform 0.18s ease;
    }

    .json-modal.is-open .json-modal-dialog {
      transform: translateY(0) scale(1);
    }

    .json-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px 14px 18px;
      background: #21262d;
      border-bottom: 1px solid #30363d;
    }

    .json-modal-heading {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      background: #3fb950;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(63, 185, 80, 0.12);
    }

    .json-modal-title {
      overflow: hidden;
      margin: 0;
      color: #f0f6fc;
      font-size: 16px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      padding: 0;
      color: #8b949e;
      background: transparent;
      border-radius: 7px;
      font-size: 26px;
      line-height: 31px;
    }

    .icon-button:hover {
      color: #f0f6fc;
      background: #30363d;
    }

    .json-modal-body {
      min-height: 220px;
      overflow: auto;
      background: #0d1117;
    }

    .json-content {
      min-height: 100%;
      margin: 0;
      padding: 20px 22px;
      color: #d4d4d4;
      font-family: Monaco, Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      tab-size: 2;
    }

    .json-key {
      color: #79c0ff;
    }

    .json-string {
      color: #a5d6ff;
    }

    .json-number {
      color: #79c0ff;
    }

    .json-boolean {
      color: #ff7b72;
      font-weight: 700;
    }

    .json-null {
      color: #d2a8ff;
      font-style: italic;
    }

    .json-content.json-error {
      color: #ff7b72;
      background: rgba(248, 81, 73, 0.08);
    }

    .json-modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 16px;
      color: #8b949e;
      background: #161b22;
      border-top: 1px solid #30363d;
      font-size: 12px;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px 10px;
      }

      .demo-header,
      .demo-body {
        padding-right: 18px;
        padding-left: 18px;
      }

      .demo-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .primary-button {
        width: 100%;
      }

      .json-modal {
        align-items: flex-end;
        padding: 0;
      }

      .json-modal-dialog {
        width: 100%;
        max-height: 92vh;
        border-right: 0;
        border-bottom: 0;
        border-left: 0;
        border-radius: 14px 14px 0 0;
      }

      .json-content {
        padding: 16px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="demo-card">
    <header class="demo-header">
      <span class="demo-badge">JavaScript ES5</span>
      <h1 class="demo-title">JSON Modal Viewer</h1>
      <p class="demo-description">
        Sửa chuỗi JSON bên dưới rồi nhấn nút để xem dữ liệu đã format và tô màu trong modal.
      </p>
    </header>

    <section class="demo-body">
      <label class="field-label" for="jsonInput">Chuỗi JSON</label>
      <textarea id="jsonInput" class="json-input" spellcheck="false">{
  "status": "success",
  "message": "Triển khai hoàn tất",
  "server": {
    "host": "192.168.1.69",
    "environment": "production",
    "region": "ap-southeast-1"
  },
  "services": [
    {
      "name": "shell-api",
      "port": 8000,
      "healthy": true
    },
    {
      "name": "worker",
      "port": 8001,
      "healthy": true
    }
  ],
  "duration_ms": 1248,
  "metadata": null
}</textarea>

      <div class="demo-actions">
        <span class="demo-hint">Modal có thể đóng bằng nút ×, nút Đóng, phím ESC hoặc click ra ngoài.</span>
        <button id="openJsonModal" class="primary-button" type="button">Xem JSON trong modal</button>
      </div>
    </section>
  </main>

  <div id="jsonModal" class="json-modal" aria-hidden="true">
    <div
      class="json-modal-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="jsonModalTitle"
    >
      <header class="json-modal-header">
        <div class="json-modal-heading">
          <span class="status-dot" aria-hidden="true"></span>
          <h2 id="jsonModalTitle" class="json-modal-title">JSON Viewer</h2>
        </div>
        <button id="closeJsonModalIcon" class="icon-button" type="button" aria-label="Đóng modal">&times;</button>
      </header>

      <div class="json-modal-body">
        <pre id="jsonModalContent" class="json-content"></pre>
      </div>

      <footer class="json-modal-footer">
        <span>Nhấn ESC để đóng</span>
        <button id="closeJsonModalButton" class="secondary-button" type="button">Đóng</button>
      </footer>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      var modal = document.getElementById("jsonModal");
      var modalTitle = document.getElementById("jsonModalTitle");
      var modalContent = document.getElementById("jsonModalContent");
      var openButton = document.getElementById("openJsonModal");
      var closeIcon = document.getElementById("closeJsonModalIcon");
      var closeButton = document.getElementById("closeJsonModalButton");
      var jsonInput = document.getElementById("jsonInput");
      var previousBodyOverflow = "";
      var previousFocusedElement = null;

      function setText(element, text) {
        if (typeof element.textContent !== "undefined") {
          element.textContent = text;
        } else {
          element.innerText = text;
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function highlightJson(json) {
        var safeJson = escapeHtml(json);

        return safeJson.replace(
          /("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
          function (value) {
            var className = "json-number";

            if (/^"/.test(value)) {
              className = /:$/.test(value) ? "json-key" : "json-string";
            } else if (/^(true|false)$/.test(value)) {
              className = "json-boolean";
            } else if (/^null$/.test(value)) {
              className = "json-null";
            }

            return '<span class="' + className + '">' + value + "</span>";
          }
        );
      }

      function isModalOpen() {
        return (" " + modal.className + " ").indexOf(" is-open ") !== -1;
      }

      function addOpenClass() {
        if (!isModalOpen()) {
          modal.className += " is-open";
        }
      }

      function removeOpenClass() {
        modal.className = modal.className.replace(/\s*\bis-open\b/g, "");
      }

      function showJsonModal(jsonString, title) {
        var parsed;
        var formatted;

        if (!isModalOpen()) {
          previousBodyOverflow = document.body.style.overflow;
          previousFocusedElement = document.activeElement;
        }

        setText(modalTitle, title || "JSON Viewer");
        modalContent.className = "json-content";

        try {
          if (typeof jsonString !== "string") {
            throw new Error("Dữ liệu đầu vào phải là một chuỗi JSON.");
          }

          parsed = JSON.parse(jsonString);
          formatted = JSON.stringify(parsed, null, 2);
          modalContent.innerHTML = highlightJson(formatted);
        } catch (error) {
          modalContent.className = "json-content json-error";
          setText(
            modalContent,
            "JSON không hợp lệ:\n\n" + (error.message || String(error))
          );
        }

        addOpenClass();
        modal.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        closeIcon.focus();
      }

      function closeJsonModal() {
        if (!isModalOpen()) {
          return;
        }

        removeOpenClass();
        modal.setAttribute("aria-hidden", "true");
        document.body.style.overflow = previousBodyOverflow;

        if (previousFocusedElement && previousFocusedElement.focus) {
          previousFocusedElement.focus();
        }
      }

      openButton.onclick = function () {
        showJsonModal(jsonInput.value, "Kết quả JSON");
      };

      closeIcon.onclick = closeJsonModal;
      closeButton.onclick = closeJsonModal;

      modal.onclick = function (event) {
        event = event || window.event;

        if (event.target === modal) {
          closeJsonModal();
        }
      };

      document.onkeydown = function (event) {
        event = event || window.event;

        if (isModalOpen() && (event.keyCode === 27 || event.key === "Escape")) {
          closeJsonModal();
        }
      };

      window.showJsonModal = showJsonModal;
      window.closeJsonModal = closeJsonModal;
    }());
  </script>
</body>
</html>
